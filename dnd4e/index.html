<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paragon 4e Builder</title>
<meta name="description" content="Build, level and play Dungeons &amp; Dragons 4th Edition characters on your phone.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paragon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<link rel="stylesheet" href="app.css?v=BUILD">
<script>
/* If the app fails to start, say why instead of showing a blank page. */
window.__ERRS = [];
window.addEventListener('error', function (e) {
  var f = e.filename || '';
  if (!f || f.indexOf(location.origin) !== 0) return;
  window.__ERRS.push((e.message || 'Error') + ' (' + f.split('/').pop().split('?')[0] + ':' + (e.lineno || 0) + ')');
});
window.addEventListener('load', function () {
  setTimeout(function () {
    if (window.__STARTED && !window.__ERRS.length) return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99;padding:24px;font:16px system-ui,sans-serif;background:#eceff4;color:#172130';
    d.innerHTML = '<p><b>Paragon failed to start.</b></p><p>' + (window.__ERRS.length ? window.__ERRS.slice(0, 3).join('<br>').replace(/<(?!br>)/g, '&lt;') : 'A file did not load. Check your connection and reload.') + '</p><p><button onclick="location.reload()" style="font-size:16px;padding:10px 16px">Reload</button></p>';
    document.body.appendChild(d);
  }, 500);
});
</script>
</head>
<body>
<div id="app"></div>
<div id="sheets"></div>
<script src="js/rules.js?v=BUILD"></script>
<script src="js/races.js?v=BUILD"></script>
<script src="js/classes.js?v=BUILD"></script>
<script src="js/powers-cleric.js?v=BUILD"></script>
<script src="js/powers-fighter.js?v=BUILD"></script>
<script src="js/powers-paladin.js?v=BUILD"></script>
<script src="js/powers-ranger.js?v=BUILD"></script>
<script src="js/powers-rogue.js?v=BUILD"></script>
<script src="js/powers-warlock.js?v=BUILD"></script>
<script src="js/powers-warlord.js?v=BUILD"></script>
<script src="js/powers-wizard.js?v=BUILD"></script>
<script src="js/feats.js?v=BUILD"></script>
<script src="js/items.js?v=BUILD"></script>
<script src="js/paths.js?v=BUILD"></script>
<script src="js/engine.js?v=BUILD"></script>
<script src="js/parse.js?v=BUILD"></script>
<script src="js/ui.js?v=BUILD"></script>
<script src="js/app.js?v=BUILD"></script>
<script src="js/main.js?v=BUILD"></script>
<script>
/* Work offline once loaded: the service worker keeps a copy of the app. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
