<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#07050a;font-family:'Cormorant Garamond',serif;color:#f3e6c8}
.scene{position:absolute;inset:0}
.gold{background:linear-gradient(180deg,#fff3c4 0%,#f0c865 38%,#b07a26 62%,#f5d27a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.frame{position:absolute;border:1px solid rgba(240,200,110,.55);box-shadow:0 0 0 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.6),inset 0 0 24px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.6);
  background:linear-gradient(180deg,rgba(28,20,30,.92),rgba(12,8,14,.95));border-radius:10px}
.frame:before{content:'';position:absolute;inset:3px;border:1px solid rgba(240,200,110,.18);border-radius:7px;pointer-events:none}
/* top banner */
.top{left:10px;right:10px;top:12px;height:58px}
.loc{position:absolute;left:0;right:0;top:7px;text-align:center;font-family:Cinzel;font-weight:800;font-size:17px;letter-spacing:2.5px;filter:drop-shadow(0 1px 0 #000) drop-shadow(0 0 8px rgba(255,170,60,.35))}
.sub{position:absolute;left:0;right:0;top:31px;text-align:center;font-size:13px;letter-spacing:1.5px;color:#d9c49a;font-style:italic}
.round{position:absolute;left:10px;top:12px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a3322,#150c08);border:1.5px solid #e8bd62;box-shadow:0 0 10px rgba(255,180,80,.4);text-align:center;font-family:Cinzel;font-weight:800}
.round b{display:block;font-size:15px;margin-top:4px}.round i{display:block;font-style:normal;font-size:7px;letter-spacing:1px;color:#c9a870;margin-top:-2px}
.menu{position:absolute;right:10px;top:12px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a2a3e,#120a14);border:1.5px solid #e8bd62}
.menu span{position:absolute;left:10px;right:10px;height:2px;background:#f0cf80;border-radius:2px}
/* boss bar */
.boss{position:absolute;left:24px;right:24px;top:80px;height:34px}
.boss .name{font-family:Cinzel;font-weight:900;font-size:13px;letter-spacing:3px;text-align:center;color:#ffd9a8;text-shadow:0 0 10px rgba(255,90,30,.8),0 1px 0 #000}
.bar{position:relative;margin-top:4px;height:12px;border-radius:7px;background:#1a0b0a;border:1px solid #c89a4a;box-shadow:0 0 12px rgba(255,80,20,.35),inset 0 1px 3px #000;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:72%;background:linear-gradient(180deg,#ff9a5a,#d8301a 55%,#8a1208);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.bar .lost{position:absolute;left:72%;top:0;bottom:0;width:9%;background:linear-gradient(180deg,#fff0c0,#ffb060);opacity:.7}
.bar .t{position:absolute;right:8px;top:-1px;font-family:Cinzel;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.pips{position:absolute;left:50%;transform:translateX(-50%);top:36px;display:flex;gap:4px}
.pip{width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,#ffb0e0,#c0308a);border:1px solid #3a0a2a;box-shadow:0 0 6px rgba(255,90,200,.7)}
.pip.e{background:#1c1018;box-shadow:none;border-color:#5a3a4a}
/* hero plate */
.hero{left:10px;right:10px;top:606px;height:58px}
.port{position:absolute;left:-2px;top:-10px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#6aa0e0 0%,#23406a 45%,#0b1424 75%);border:2px solid #f0cc78;box-shadow:0 0 0 3px #1a1008,0 0 16px rgba(120,180,255,.5)}
.hn{position:absolute;left:78px;top:6px;font-family:Cinzel;font-weight:800;font-size:15px;letter-spacing:1.5px}
.hc{position:absolute;left:78px;top:24px;font-size:12px;color:#b9a784;font-style:italic}
.hbar{position:absolute;left:78px;right:12px;top:40px;height:8px;border-radius:5px;background:#0c1a0c;border:1px solid #9a8448;overflow:hidden}
.hbar div{height:100%;width:84%;background:linear-gradient(180deg,#c8ff9a,#3aa83a 60%,#1a6a1a)}
.mom{position:absolute;right:12px;top:10px;display:flex;gap:3px}
.gem{width:11px;height:11px;transform:rotate(45deg);background:linear-gradient(135deg,#e8d8ff,#8a5aff 50%,#3a1a8a);border:1px solid #1a0a3a;box-shadow:0 0 7px rgba(170,120,255,.9)}
.gem.e{background:#150f22;box-shadow:none;border-color:#4a3a6a}
/* abilities */
.cards{position:absolute;left:8px;right:8px;top:676px;display:flex;gap:6px}
.card{position:relative;flex:1;height:98px;border-radius:10px;background:linear-gradient(180deg,#2a1c22,#120b10);border:1px solid rgba(232,190,100,.6);box-shadow:inset 0 0 0 1px #000,0 4px 10px rgba(0,0,0,.6);overflow:hidden}
.card.sel{border-color:#ffe29a;box-shadow:inset 0 0 0 1px #000,0 0 0 1px #ffd070,0 0 18px rgba(255,200,90,.55);transform:translateY(-6px)}
.card .art{position:absolute;left:6px;right:6px;top:6px;height:52px;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.8)}
.card .nm{position:absolute;left:0;right:0;top:61px;text-align:center;font-family:Cinzel;font-weight:800;font-size:9.5px;letter-spacing:.6px;color:#f7e3b0}
.card .st{position:absolute;left:0;right:0;top:75px;text-align:center;font-size:11px;color:#c9b48c}
.card .cost{position:absolute;right:5px;top:5px;display:flex;gap:2px}
.card .cost i{width:8px;height:8px;transform:rotate(45deg);background:linear-gradient(135deg,#e8d8ff,#8a5aff);border:1px solid #1a0a3a;box-shadow:0 0 5px #a080ff}
/* action bar */
.acts{position:absolute;left:8px;right:8px;top:786px;height:46px;display:flex;gap:6px}
.btn{flex:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:Cinzel;font-weight:800;font-size:11px;letter-spacing:1.5px;color:#d8c49a;
  background:linear-gradient(180deg,#2c2226,#140d10);border:1px solid rgba(232,190,100,.45);box-shadow:inset 0 1px 0 rgba(255,230,180,.15),0 3px 8px rgba(0,0,0,.6)}
.btn.go{flex:1.7;color:#2a1404;font-size:13px;background:linear-gradient(180deg,#ffe6a0,#f0b44a 45%,#b8701e);border-color:#fff0c0;box-shadow:inset 0 1px 0 #fff,0 0 16px rgba(255,190,80,.45),0 3px 8px rgba(0,0,0,.6);text-shadow:0 1px 0 rgba(255,240,200,.6)}
/* floating labels */
.float{position:absolute;font-family:Cinzel;font-weight:900;text-align:center}
.tip{position:absolute;left:222px;top:302px;width:160px;padding:6px 8px;border-radius:8px;background:rgba(14,8,10,.88);border:1px solid rgba(255,120,80,.6);box-shadow:0 0 14px rgba(255,80,40,.3);font-size:12px;line-height:1.25}
.tip b{font-family:Cinzel;font-size:10px;letter-spacing:1px;color:#ffb08a}
.tip .row{display:flex;justify-content:space-between;margin-top:3px;font-family:Cinzel;font-weight:800;font-size:10px}
</style></head>
<body>
<div class="scene">

<defs>

  </linearGradient>

  <filter id="clouds" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".008 .03" numOctaves="5" seed="7"/>

  <filter id="groundTex" x="0" y="0" width="100%" height="100%">

  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></linearGradient>
  <radialGradient id="lava" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff0a0"/><stop offset=".35" stop-color="#ff8a20"/><stop offset=".75" stop-color="#b8280a"/><stop offset="1" stop-color="#3a0a04" stop-opacity="0"/></radialGradient>

  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffc070"/><stop offset="1" stop-color="#ff6a20" stop-opacity="0"/></linearGradient>
  <radialGradient id="base" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#000" stop-opacity=".0"/><stop offset=".7" stop-color="#8ac8ff" stop-opacity=".9"/><stop offset=".78" stop-color="#2a6ab0" stop-opacity=".5"/><stop offset="1" stop-color="#2a6ab0" stop-opacity="0"/></radialGradient>
  <radialGradient id="baseR" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#ff8a6a" stop-opacity=".95"/><stop offset=".78" stop-color="#b02a1a" stop-opacity=".5"/><stop offset="1" stop-color="#b02a1a" stop-opacity="0"/></radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f0e8"/><stop offset=".5" stop-color="#9aa4b4"/><stop offset="1" stop-color="#3a4250"/></linearGradient>

</defs>
