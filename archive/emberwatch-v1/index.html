async function onTap(x,y){
  if(!G||G.over)return;
  const k=K(x,y);const t=unitAt(x,y);
  if(UI.busy||G.phase!=='player'){if(t&&t.side==='enemy'){UI.inspect=t.id;renderInfo();}return;}
  const u=selUnit();
  if(u&&canCommand(u)){
    const V=view();const p=u.side==='hero'?powerOf(u,UI.pi):null;
    if(UI.pend&&UI.pend.k===k)return doPending();
    if(p&&V.targets.has(k)&&!u.acted){
      if(p.tgt==='self'&&t===u)return setPend(k);
      if(p.tgt==='enemy'&&t)return setPend(k);
      if(p.tgt==='ally'&&t&&!(t===u&&V.moves.size>1&&false))return setPend(k);
      if(p.tgt==='tile')return setPend(k);
    }
    if(V.moves.has(k)&&(!t||t===u)&&t!==u)return doMove(u,V.moves.get(k));
    if(t===u){UI.sel=null;UI.pend=null;sfx('click');renderAll();return;}
  }
  if(t&&(t.side==='hero'||t.kind==='villager')){if(canCommand(t))selectUnit(t);else{UI.sel=null;UI.inspect=null;renderAll();if(t.side==='hero')heroSheet(t.cls);}return;}
  if(t&&t.side==='enemy'){UI.sel=null;UI.pend=null;UI.inspect=t.id;sfx('click');renderAll();return;}
  UI.sel=null;UI.pend=null;UI.inspect=null;renderAll();
}
(function bindBoard(){
  const b=$('#board');
  const tileOf=ev=>{const r=b.getBoundingClientRect();const x=Math.floor((ev.clientX-r.left)/S),y=Math.floor((ev.clientY-r.top)/S);return inB(x,y)?{x,y}:null;};
  b.addEventListener('pointerdown',ev=>{if(!G||UI.busy)return;const t=tileOf(ev);if(!t)return;UI.ptr={id:ev.pointerId,sx:ev.clientX,sy:ev.clientY,t,drag:false,last:null};try{b.setPointerCapture(ev.pointerId);}catch(e){}});
  b.addEventListener('pointermove',ev=>{
    const P=UI.ptr;if(!P||P.id!==ev.pointerId)return;
    if(!P.drag){
      if(Math.hypot(ev.clientX-P.sx,ev.clientY-P.sy)<S*.4)return;
      const u=unitAt(P.t.x,P.t.y);if(!u||!canCommand(u)){P.nodrag=true;return;}
      if(UI.sel!==u.id)selectUnit(u);P.drag=true;UI.drag={id:u.id};renderUnits();
    }
    const u=U(UI.drag.id);const r=b.getBoundingClientRect();
    TOK[u.id].style.transform=`translate(${ev.clientX-r.left-S/2}px,${ev.clientY-r.top-S/2}px)`;
    const t=tileOf(ev);if(!t)return;const k=K(t.x,t.y);if(P.last===k)return;P.last=k;
    const V=view();const p=u.side==='hero'?powerOf(u,UI.pi):null;const o=unitAt(t.x,t.y);
    if(p&&!u.acted&&V.targets.has(k)&&o&&o!==u&&(p.tgt==='enemy'||p.tgt==='ally')){setPend(k,true);}
    else if(V.moves.has(k)&&(!o||o===u)){UI.pend=null;UI.movePath=true;renderInfo();renderHL(V);drawPath(pathOf(V.moves.get(k)),u);UI.movePath=false;}
    else{UI.pend=null;renderInfo();drawPath(null);}
  });
  const up=async ev=>{
    const P=UI.ptr;UI.ptr=null;if(!P||P.id!==ev.pointerId)return;
    const t=tileOf(ev);
    if(P.drag){
      const u=U(UI.drag.id);UI.drag=null;
      if(!t){renderAll();return;}
      const k=K(t.x,t.y);const V=view();const o=unitAt(t.x,t.y);
      if(UI.pend&&UI.pend.k===k)return doPending();
      if(V&&V.moves.has(k)&&(!o||o===u)&&!(t.x===u.x&&t.y===u.y))return doMove(u,V.moves.get(k));
      drawPath(null);renderAll();return;
    }
    if(P.nodrag&&t&&(t.x!==P.t.x||t.y!==P.t.y))return;
    if(t)await onTap(t.x,t.y);
  };
  b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',()=>{UI.ptr=null;if(UI.drag){UI.drag=null;renderAll();}});
})();

  if(s==='train'){
    body=`<div class="sec"><h3>Train a new power</h3><div class="offers">${P.offers.map((o,i)=>{const p=POWERS[o.id];const h=RUN.heroes.find(x=>x.cls===o.cls);const b=charFor(h.lvl)+(hasR('whetstone')?1:0);
      return `<button class="offer" data-i="${i}"><div class="pt">${ART(o.cls)}</div><div><div class="meta">${CLASSES[o.cls].name} learns</div><b>${p.icon} ${p.name}</b><small>${p.dmg&&!p.noDmg?p.dmg.map(d=>d+b).join('/')+' damage. ':''}${p.desc} ${p.cost?`Costs ${p.cost} ${CLASSES[o.cls].res}.`:'At-will.'}</small></div></button>`;}).join('')}</div></div>`;
  }else if(s==='relic'){
    body=`<div class="sec"><h3>Choose a relic</h3><div class="offers">${P.offers.map((r,i)=>`<button class="offer" data-i="${i}"><div class="oi">${RELICS[r].icon}</div><div><b>${RELICS[r].name}</b><small>${RELICS[r].desc}</small></div></button>`).join('')}</div><p class="relhint">Only two relics work at once. Swap them on the map.</p></div>`;
  }else{
    body=`<div class="sec"><h3>Make camp</h3><div class="offers"><button class="offer" data-i="0"><div class="oi">🔥</div><div><b>Rest by the fire</b><small>Every hero recovers 70% of their health.</small></div></button></div></div>`;
  }
  R.innerHTML=head+body;
  R.querySelectorAll('.offer').forEach(b=>b.onclick=()=>{sfx(s==='rest'?'heal':'chest');const i=+b.dataset.i;takeReward(s==='rest'?'rest':P.offers[i]);saveGame();goReward();});
  R.scrollTop=0;
}
function goMap(){RUN.stage='map';RUN.pending=null;if(!RUN.choices)RUN.choices=genChoices(RUN.f);saveGame();show('sMap');renderMap();}
function renderMap(){
  const act=Math.min(2,Math.floor(RUN.f/4));const M=$('#sMap');
  let track='';for(let i=0;i<TOTAL;i++){const boss=i%4===3;track+=`<div class="node${i<RUN.f?' done':''}${i===RUN.f?' cur':''}${boss?' boss':''}">${boss?'💀':''}</div>`;}
  const party=RUN.heroes.map(h=>`<button class="pcard" data-c="${h.cls}"><div class="pt">${ART(h.cls)}</div><b>${CLASSES[h.cls].name}</b><small>Lv ${h.lvl} ${CLASSES[h.cls].title}</small><div class="bar"><i style="width:${h.hp/effMax(h)*100}%"></i></div><small>${h.hp}/${effMax(h)}</small></button>`).join('');
  const eq=[0,1].map(i=>{const r=RUN.equipped[i];return r?`<button class="slot" data-r="${r}" aria-label="${RELICS[r].name}">${RELICS[r].icon}</button>`:`<div class="slot empty">Empty</div>`;}).join('');
  const bag=RUN.relics.filter(r=>!RUN.equipped.includes(r)).map(r=>`<button class="slot bag" data-r="${r}" aria-label="${RELICS[r].name}">${RELICS[r].icon}</button>`).join('');
  const encs=RUN.choices.map((e,i)=>{
    const Ms=MISSIONS[e.type];const types={};e.enemies.forEach(x=>{if(x.type!=='pillar')types[x.type]=(types[x.type]||0)+1;});
    const foes=Object.entries(types).map(([t,n])=>`<span>${ART(MON[t].art)}${n>1?`<em>${n}</em>`:''}</span>`).join('');
    const boss=e.type==='boss';
    return `<div class="enc${boss?' boss':''}"><div class="top"><div class="mi">${boss?`<div style="width:44px;height:44px;border-radius:12px;overflow:hidden">${ART(MON[BOSSES[e.act]].art)}</div>`:Ms.icon}</div><div><div class="kind">${boss?'Boss':Ms.name}</div><h2>${e.title}</h2></div></div><p>${boss?BOSS_TXT[e.act]:Ms.desc}</p><div class="foes">${foes}</div><div class="row"><span class="reward">${REW[e.reward].icon} ${REW[e.reward].txt}</span><button class="btn" data-i="${i}">March</button></div></div>`;
  }).join('');
  M.innerHTML=`<div class="acthead"><h1>${ACTS[act].name}</h1><p>${ACTS[act].sub}</p></div><div class="track">${track}</div>
   <div class="sec"><h3>Party</h3><div class="partyrow">${party}</div></div>
   <div class="sec"><h3>Relics</h3><div class="relics">${eq}${bag?'<span style="width:6px"></span>'+bag:''}</div><p class="relhint">${RUN.relics.length?'Tap a relic to read it and equip it. Two work at once.':'Relics you find appear here.'}</p></div>
   <div class="sec"><h3>${RUN.choices.length>1?'Choose your next battle':'The final battle of the act'}</h3><div style="display:flex;flex-direction:column;gap:12px">${encs}</div></div>
   <div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1" id="mSet">Settings</button><button class="btn ghost" style="flex:1" id="mHow">How to play</button></div>`;
  M.querySelectorAll('.pcard').forEach(b=>b.onclick=()=>heroSheet(b.dataset.c));
  M.querySelectorAll('.slot[data-r]').forEach(b=>b.onclick=()=>{const r=b.dataset.r;const on=RUN.equipped.includes(r);
    openModal(`<h2>${RELICS[r].icon} ${RELICS[r].name}</h2><p>${RELICS[r].desc}</p><button class="btn" id="rT">${on?'Unequip':RUN.equipped.length>=2?`Equip, replacing ${RELICS[RUN.equipped[0]].name}`:'Equip'}</button>`);
    $('#rT').onclick=()=>{toggleRelic(r);saveGame();sfx('click');closeModal();renderMap();};});
  M.querySelectorAll('.enc .btn').forEach(b=>b.onclick=()=>startBattle(RUN.choices[+b.dataset.i]));
  $('#mSet').onclick=()=>settings(false);$('#mHow').onclick=howTo;
  M.scrollTop=0;
}
async function startBattle(enc){
  RUN.stage='battle';RUN.choices=null;setupBattle(enc);enterBattle();
  await sleep(60);
  await startPlayerPhase();renderAll();
}
function enterBattle(){
  show('sBattle');UI.sel=null;UI.pend=null;UI.inspect=null;UI.danger=false;UI.busy=false;trayKey='';
  $('#units').innerHTML='';$('#fx').innerHTML='';for(const k in TOK)delete TOK[k];
  sizeBoard();renderAll(true);
}
function showEnd(won){
  show('sEnd');const E=$('#sEnd');
  let best=0;try{best=+(localStorage.getItem('emberwatch.best')||0);}catch(e){}
  if(won){clearSave();try{localStorage.setItem('emberwatch.best',TOTAL);}catch(e){}}
  E.innerHTML=`<div class="rhead" style="margin-top:8vh"><div style="width:120px;height:120px;border-radius:50%;overflow:hidden;margin:0 auto 14px;box-shadow:0 0 0 4px ${won?'#f3c54a':'#e5484d'}">${ART(won?'dragon':'fighter')}</div><h1>${won?'The Ashen Dragon falls':'The watch is broken'}</h1><p>${won?'Emberwatch stands. Songs will be sung of this company.':`Your party fell in ${ACTS[Math.min(2,Math.floor(RUN.f/4))].sub}. Another company will rise.`}</p></div>
  <div class="endstats"><div><b>${RUN.stats.wins}</b>battles won</div><div><b>${RUN.stats.kills}</b>foes slain</div><div><b>${Math.max(best,RUN.f)}</b>best reach</div></div>
  <div class="partyrow">${RUN.heroes.map(h=>`<div class="pcard"><div class="pt">${ART(h.cls)}</div><b>${CLASSES[h.cls].name}</b><small>Level ${h.lvl}</small></div>`).join('')}</div>
  <button class="btn" id="eNew">Begin a new run</button><button class="btn ghost" id="eT">Title screen</button>`;
  $('#eNew').onclick=()=>{newRun();goMap();};$('#eT').onclick=goTitle;
}
function goTitle(){
  show('sTitle');G=null;
  $('#bCont').hidden=!loadSave();
  $('#tParty').innerHTML=ORDER.map(c=>`<div>${ART(c)}</div>`).join('');
}
function continueRun(){
  const d=loadSave();if(!d)return;RUN=d;
  if(RUN.stage==='battle'&&RUN.battle){restore(RUN.battle);enterBattle();if(G.phase!=='player')startPlayerPhase().then(renderAll);}
  else if(RUN.stage==='battle'){RUN.stage='map';goMap();}
  else if(RUN.stage==='reward'&&RUN.pending)goReward();
  else goMap();
}
$('#bCont').onclick=()=>{sfx('click');continueRun();};
$('#bNew').onclick=()=>{sfx('click');const go=()=>{closeModal();newRun();goMap();};if(loadSave()){openModal(`<h2>Start over?</h2><p>This replaces your saved run.</p><button class="btn" id="nY">Start a new run</button>`);$('#nY').onclick=go;}else go();};
$('#bHow').onclick=howTo;$('#bTSet').onclick=()=>settings(false);
(function embers(){const t=$('#sTitle');for(let i=0;i<22;i++){const e=document.createElement('i');e.className='ember';e.style.left=Math.random()*100+'%';e.style.animationDuration=(6+Math.random()*8)+'s';e.style.animationDelay=(-Math.random()*10)+'s';t.appendChild(e);}})();
goTitle();
</script>
</body>
</html>
