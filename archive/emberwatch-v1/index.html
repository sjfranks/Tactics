<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Emberwatch Tactics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6dfcd;--bg2:#d8ceb6;--panel:#f7f1e3;--panel2:#ece2c9;--line:#b9a57a;--ink:#2a2217;--mute:#6b5e4a;--gold:#8f6414;--gold2:#b8862a;--hero:#2f7fe0;--foe:#c8343a;--ok:#2f9a55;--mal:#7a4ad8;--shadow:rgba(60,40,10,.22);--card:linear-gradient(180deg,#fbf6ea,#efe5cc);--btnink:#2a1c08}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a26;--bg2:#1c2435;--panel:#20283a;--panel2:#2a3449;--line:#3d4a68;--ink:#efe7d4;--mute:#a4aec4;--gold:#d9b35c;--gold2:#f3d58a;--hero:#4aa3ff;--foe:#e5484d;--ok:#57c27a;--mal:#a47bff;--shadow:rgba(0,0,0,.5);--card:linear-gradient(180deg,#2b3550,#212a3d)}}
:root[data-theme="dark"]{--bg:#141a26;--bg2:#1c2435;--panel:#20283a;--panel2:#2a3449;--line:#3d4a68;--ink:#efe7d4;--mute:#a4aec4;--gold:#d9b35c;--gold2:#f3d58a;--hero:#4aa3ff;--foe:#e5484d;--ok:#57c27a;--mal:#a47bff;--shadow:rgba(0,0,0,.5);--card:linear-gradient(180deg,#2b3550,#212a3d)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
h1,h2,h3,.cz{font-family:Cinzel,'Trajan Pro',Georgia,serif;font-weight:700;letter-spacing:.02em;margin:0}
#app{position:relative;height:100%;max-width:560px;margin:0 auto}
.screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.screen.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.btn{border:0;border-radius:10px;padding:12px 18px;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:16px;color:var(--btnink);background:linear-gradient(180deg,#f6dc93,#c9962f);box-shadow:0 2px 0 #7a5410,0 4px 12px var(--shadow),inset 0 1px 0 #fff6d0}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #7a5410}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn[disabled]{filter:grayscale(1);opacity:.5}
/* ---------- title ---------- */
#sTitle{justify-content:flex-end;align-items:center;padding:24px 22px 34px;background:radial-gradient(120% 70% at 50% 18%,#6a3a1c 0%,#2a1a14 45%,#0e1018 100%);color:#f3ead6;overflow:hidden}
#sTitle .mount{position:absolute;left:0;right:0;bottom:0;height:62%;pointer-events:none}
#sTitle .logo{position:relative;text-align:center;margin-bottom:auto;margin-top:14vh}
#sTitle .logo h1{font-size:clamp(44px,13vw,68px);font-weight:900;line-height:1;background:linear-gradient(180deg,#fff2c4 0%,#f0bf55 55%,#a8661c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a1c08) drop-shadow(0 0 22px rgba(255,150,60,.35))}
#sTitle .logo p{margin:10px 0 0;font-family:Cinzel,Georgia,serif;letter-spacing:.35em;color:#e8c883;font-size:14px}
#sTitle .tag{position:relative;font-size:17px;color:#d8cab0;margin:0 0 18px;text-align:center}
#sTitle .party{position:relative;display:flex;gap:10px;margin-bottom:22px}
#sTitle .party div{width:62px;height:62px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #4aa3ff,0 0 0 5px #0d1422,0 6px 16px #000a}
#sTitle .menu{position:relative;display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.ember{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#ffb34a;box-shadow:0 0 6px 2px #ff7a1a;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-90vh) translateX(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.ember{display:none}}
/* ---------- map ---------- */
#sMap{padding:14px 14px 18px;gap:14px}
.acthead{text-align:center;padding:4px 0 0}
.acthead h1{font-size:28px;color:var(--gold)}
.acthead p{margin:2px 0 0;color:var(--mute);font-family:Cinzel,Georgia,serif;font-size:15px}
.track{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 0;position:relative}
.track::before{content:'';position:absolute;left:12px;right:12px;top:50%;height:2px;background:var(--line);transform:translateY(3px)}
.node{position:relative;width:14px;height:14px;border-radius:50%;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line);font-size:11px;display:grid;place-items:center}
.node.done{background:var(--gold);box-shadow:none}
.node.cur{background:var(--gold2);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--gold2),0 0 12px var(--gold2)}
.node.boss{width:24px;height:24px;font-size:14px}
.sec h3{font-size:14px;color:var(--mute);margin:0 0 8px;font-weight:700}
.partyrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pcard{background:var(--card);border-radius:12px;padding:8px 6px;text-align:center;box-shadow:inset 0 0 0 1px var(--line),0 2px 6px var(--shadow);border:0}
.pcard .pt{width:52px;height:52px;margin:0 auto 4px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--hero)}
.pcard b{display:block;font-size:14px}
.pcard small{color:var(--mute);font-size:12px}
.bar{height:6px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#39b556,#8ef07e)}
.relics{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.slot{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--gold);border:0;position:relative}
.slot.empty{box-shadow:inset 0 0 0 2px var(--line);opacity:.6;font-size:13px;color:var(--mute)}
.slot.bag{width:44px;height:44px;font-size:21px;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px}
.relhint{font-size:13px;color:var(--mute);margin-top:6px}
.enc{background:var(--card);border-radius:14px;padding:14px;box-shadow:inset 0 0 0 1px var(--line),0 4px 14px var(--shadow);display:flex;flex-direction:column;gap:8px}
.enc.boss{box-shadow:inset 0 0 0 2px var(--foe),0 6px 20px var(--shadow)}
.enc .top{display:flex;gap:12px;align-items:center}
.enc .mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--panel2);flex:none}
.enc h2{font-size:18px}
.enc .kind{font-size:13px;color:var(--gold);font-weight:700}
.enc p{margin:0;font-size:15px;color:var(--mute)}
.foes{display:flex;gap:6px;flex-wrap:wrap}
.foes span{width:34px;height:34px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--foe);position:relative}
.foes em{position:absolute;right:-2px;bottom:-2px;font-style:normal;font-size:11px;font-weight:800;background:var(--foe);color:#fff;border-radius:8px;padding:0 4px}
.enc .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.reward{font-size:14px;font-weight:700;color:var(--ink);background:var(--panel2);border-radius:20px;padding:5px 10px}
/* ---------- battle ---------- */
#sBattle{padding:6px 6px 6px;gap:6px}
#tb{display:flex;align-items:center;gap:6px;height:38px;flex:none}
.chip{border:0;border-radius:20px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);padding:6px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bObj{flex:1}
#malice{background:linear-gradient(180deg,#5a3aa0,#2e1a5a);color:#f0e6ff;box-shadow:inset 0 0 0 1px #a47bff,0 0 10px rgba(164,123,255,.35)}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;flex:none}
.ib svg,.cb svg{width:20px;height:20px}
#info{height:98px;flex:none;background:var(--panel);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line),0 2px 8px var(--shadow);padding:8px 10px;overflow:hidden;position:relative}
#bwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#board{position:relative;touch-action:none;border-radius:8px;overflow:hidden;box-shadow:0 0 0 2px #2a1c08,0 0 0 4px #b8862a,0 0 0 5px #2a1c08,0 8px 24px rgba(0,0,0,.5);background:#222}
#board>*{position:absolute;left:0;top:0}
#terr{pointer-events:none}
#hl,#objs,#units,#fx,#paths{width:100%;height:100%;pointer-events:none}
.h{position:absolute;border-radius:5px}
.h.mv{background:rgba(70,145,255,.34);box-shadow:inset 0 0 0 2px rgba(160,210,255,.8),inset 0 0 14px rgba(120,180,255,.55)}
.h.at{background:rgba(235,60,60,.38);box-shadow:inset 0 0 0 2px rgba(255,150,150,.85),inset 0 0 12px rgba(255,90,90,.5)}
.h.as{background:rgba(70,200,110,.34);box-shadow:inset 0 0 0 2px rgba(170,255,190,.85)}
.h.ar{background:rgba(255,170,60,.16);box-shadow:inset 0 0 0 1px rgba(255,200,120,.45)}
.h.rg{background:rgba(235,60,60,.17)}
.h.emv{background:rgba(235,80,60,.3);box-shadow:inset 0 0 0 1px rgba(255,150,120,.6)}
.h.dz{background:rgba(150,80,255,.22);box-shadow:inset 0 0 0 1px rgba(190,150,255,.4)}
.h.aoe{background:rgba(255,160,40,.38);box-shadow:inset 0 0 0 2px rgba(255,220,140,.9)}
.h.pend{box-shadow:inset 0 0 0 3px #fff,0 0 14px 3px rgba(255,255,255,.6);animation:pend 1s ease-in-out infinite}
@keyframes pend{50%{box-shadow:inset 0 0 0 3px #fff,0 0 4px 1px rgba(255,255,255,.3)}}
.chest{position:absolute;display:grid;place-items:center}
.chest svg{width:62%;filter:drop-shadow(0 0 6px #ffd35a)}
.wall{position:absolute;border-radius:6px;background:linear-gradient(135deg,rgba(230,248,255,.95),rgba(140,200,240,.85) 55%,rgba(90,150,210,.9));box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),0 3px 6px rgba(0,0,0,.4)}
.zone{position:absolute;border-radius:10px;opacity:.55;animation:zp 2s ease-in-out infinite}
.zone.poison{background:radial-gradient(circle,rgba(150,230,80,.7),rgba(80,140,30,.2) 70%)}
.zone.holy{background:radial-gradient(circle,rgba(255,240,160,.7),rgba(255,200,80,.15) 70%)}
.zone.arcane{background:radial-gradient(circle,rgba(200,160,255,.75),rgba(120,80,220,.15) 70%)}
@keyframes zp{50%{opacity:.35}}
.tok{position:absolute;left:0;top:0;transition:transform .14s linear,opacity .3s;will-change:transform}
.tok .med{position:absolute;left:9%;top:3%;width:82%;height:82%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 calc(var(--s)*.05) var(--ring),0 0 0 calc(var(--s)*.07) rgba(0,0,0,.55),0 4px 8px rgba(0,0,0,.6)}
.tok .med svg{display:block;width:100%;height:100%}
.tok.hero{--ring:#4aa3ff}.tok.enemy{--ring:#e0484a}.tok.npc{--ring:#57c27a}.tok.boss,.tok.leader{--ring:#f3c54a}.tok.obj{--ring:#a47bff}
.tok.boss .med{box-shadow:0 0 0 calc(var(--s)*.06) #f3c54a,0 0 0 calc(var(--s)*.085) #6a1a0a,0 0 14px rgba(255,120,40,.7)}
.tok .hp{position:absolute;left:20%;right:20%;bottom:1%;height:9%;background:#0a0a0acc;border-radius:3px;box-shadow:0 0 0 1px #000;overflow:hidden}
.tok .hp i{display:block;height:100%;background:linear-gradient(180deg,#9df28f,#2fae4a);transition:width .3s}
.tok.enemy .hp i{background:linear-gradient(180deg,#ff9a8a,#d02a2a)}
.tok .hpn{position:absolute;left:0;bottom:0;font:800 calc(var(--s)*.2px)/1 'Alegreya Sans',sans-serif;font-size:calc(var(--s)*.21px);color:#fff;text-shadow:0 0 3px #000,0 1px 0 #000;min-width:22%;text-align:center;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 2px}
.tok .sts{position:absolute;right:0;top:0;font-size:calc(var(--s)*.19px);line-height:1;display:flex;flex-direction:column;filter:drop-shadow(0 0 2px #000)}
.tok .shd{position:absolute;left:0;top:0;font:800 11px/1 sans-serif;color:#fff;background:#3a7fd0;border-radius:8px;padding:2px 4px;box-shadow:0 0 0 1px #0a2a5a}
.tok.acted .med{filter:grayscale(.9) brightness(.62)}
.tok.sel .med{box-shadow:0 0 0 calc(var(--s)*.05) #fff,0 0 0 calc(var(--s)*.07) var(--ring),0 0 16px 5px rgba(150,210,255,.8)}
.tok.insp .med{box-shadow:0 0 0 calc(var(--s)*.05) #fff,0 0 14px 4px rgba(255,120,120,.8)}
.tok.dead{opacity:0;transform-origin:center}
.tok.hidden .med{opacity:.55}
.tok.drag{transition:none;z-index:5;filter:drop-shadow(0 10px 8px rgba(0,0,0,.6))}
.tok.hit .med{animation:hit .28s}
@keyframes hit{0%,100%{filter:none}30%{filter:brightness(2.2) saturate(0) }60%{transform:translateX(3px)}}
.tok .cage{display:none;position:absolute;inset:4% 10% 14%;border-radius:8px;background:repeating-linear-gradient(90deg,transparent 0 16%,#3a3a3a 16% 22%);box-shadow:inset 0 0 0 3px #3a3a3a}
.tok.caged .cage{display:block}
.pop{position:absolute;transform:translate(-50%,-50%);font:900 20px/1 'Alegreya Sans',sans-serif;color:#fff;-webkit-text-stroke:1px #000;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap;animation:pop 1.1s ease-out forwards;pointer-events:none;z-index:9}
.pop.crit{color:#ffd23a;font-size:26px}.pop.heal{color:#8ff08a}.pop.shield{color:#9fd0ff}.pop.gold{color:#ffe08a;font-size:17px}.pop.call{color:#fff;font-size:15px}.pop.res{color:#d9b8ff;font-size:14px}.pop.bad{color:#ff9a8a;font-size:14px}
.pop.tier{font-size:12px;color:#fff;-webkit-text-stroke:0;background:rgba(0,0,0,.6);border-radius:8px;padding:2px 6px;text-shadow:none}
.pop.t3{background:#b8862a}.pop.t1{background:#555}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-10%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.proj{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;z-index:8}
.aflash{position:absolute;border-radius:8px;animation:af .6s ease-out forwards;z-index:7}
.aflash.fire{background:radial-gradient(circle,rgba(255,240,150,.95),rgba(255,110,20,.75) 45%,rgba(160,20,0,0) 72%)}
.aflash.force,.aflash.arcane{background:radial-gradient(circle,rgba(240,220,255,.9),rgba(150,100,255,.6) 45%,rgba(90,40,200,0) 72%)}
.aflash.holy{background:radial-gradient(circle,rgba(255,255,220,.95),rgba(255,210,90,.6) 45%,rgba(255,180,40,0) 72%)}
.aflash.ice,.aflash.web{background:radial-gradient(circle,rgba(240,255,255,.95),rgba(140,210,255,.6) 45%,rgba(60,140,220,0) 72%)}
.aflash.poison{background:radial-gradient(circle,rgba(220,255,160,.9),rgba(110,190,40,.6) 45%,rgba(60,120,20,0) 72%)}
.aflash.row{background:linear-gradient(90deg,rgba(255,90,0,.2),rgba(255,200,80,.95),rgba(255,90,0,.2))}
@keyframes af{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.15)}}
.warnpin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#e5484d;color:#fff;font:900 12px/18px sans-serif;text-align:center;box-shadow:0 0 0 2px #fff,0 0 8px #e5484d;z-index:6}
/* info panel */
.ih{display:flex;gap:10px;align-items:center;height:100%}
.pt{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--hero)}
.pt.enemy{box-shadow:0 0 0 3px var(--foe)}.pt.npc{box-shadow:0 0 0 3px var(--ok)}.pt.boss{box-shadow:0 0 0 3px #f3c54a}
.pt svg{display:block;width:100%;height:100%}
.ib2{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-family:'Alegreya Sans',sans-serif;font-weight:500;font-size:13px;color:var(--mute);margin-left:6px}
.hpline{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.hpline .bar{flex:1;height:8px;margin:0}
.pips{display:flex;gap:3px;align-items:center;font-size:13px;color:var(--mute)}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.pips i.on{background:radial-gradient(circle at 35% 35%,#e8d8ff,#8a5ae8);box-shadow:0 0 5px #a47bff}
.desc{font-size:12.5px;color:var(--mute);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.desc b{color:var(--ink)}
.stchips{display:flex;gap:4px;flex-wrap:wrap;font-size:12px}
.stchips span{background:var(--panel2);border-radius:8px;padding:0 6px}
.roster{display:flex;gap:8px;height:100%;align-items:center}
.rm{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;min-width:0}
.rm .pt{width:46px;height:46px}
.rm .bar{width:100%;height:5px;margin:0}
.rm.acted .pt{filter:grayscale(.9) brightness(.7)}
.rm small{font-size:11px;color:var(--mute);white-space:nowrap}
.fc{display:flex;align-items:center;gap:8px;height:100%}
.fc .pt{width:50px;height:50px}
.fm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fp{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp em{font-style:normal;color:var(--mute);font-weight:500}
.tiers{display:flex;gap:4px}
.ti{flex:1;border-radius:7px;text-align:center;padding:1px 0;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.ti b{display:block;font-size:16px;line-height:1.1}
.ti small{font-size:11px;color:var(--mute)}
.ti.t3{box-shadow:inset 0 0 0 1px var(--gold2)}.ti.t3 b{color:var(--gold)}
.fl{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .e{color:var(--ok);font-weight:800}.fl .b{color:var(--foe);font-weight:800}.fl .k{color:var(--foe);font-weight:800}
.ft{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px}
.go{border:0;border-radius:10px;padding:0 10px;height:64px;font-family:Cinzel,Georgia,serif;font-weight:700;color:var(--btnink);background:linear-gradient(180deg,#f6dc93,#c9962f);box-shadow:0 2px 0 #7a5410}
/* tray */
#tray{flex:none;height:86px;display:flex;flex-direction:column;gap:4px}
#pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:74px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 1px}
.page.hint{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:15px;background:var(--panel);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.pc{position:relative;border:0;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line),0 2px 5px var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 3px;min-width:0}
.pc .pi{font-size:22px;line-height:1}
.pc .pn{font-size:12px;font-weight:800;line-height:1.1;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .pd{font-size:11px;color:var(--mute);font-weight:700}

const man=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const cheb=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
const inB=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tv=(arr,t)=>arr?(arr[t-1]||0):0;

function tierOf(nat,mod,net){
  const m=mod+(net===1?2:net===-1?-2:0);const v=nat+m;
  let t=v<=11?1:v<=16?2:3;
  if(net>=2)t=Math.min(3,t+1);else if(net<=-2)t=Math.max(1,t-1);
  if(nat>=19)t=3;
  return t;
}
function tierProbs(mod,net){const k=mod+'|'+net;if(_pc[k])return _pc[k];const p=[0,0,0];for(let a=1;a<=10;a++)for(let b=1;b<=10;b++)p[tierOf(a+b,mod,net)-1]+=.01;return _pc[k]=p;}

const heroes=()=>G.units.filter(u=>u.side==='hero'&&live(u));

const friends=()=>G.units.filter(u=>u.side!=='enemy'&&live(u));
const unitAt=(x,y)=>G.units.find(u=>live(u)&&u.x===x&&u.y===y);
const isFoe=(a,b)=>(a.side==='enemy')!==(b.side==='enemy');
const mon=u=>MON[u.type];
const hasR=r=>!!RUN&&RUN.equipped.includes(r);
const charOf=u=>u.side==='hero'?u.char+(hasR('dice')?1:0):(u.roll||0);
function blocked(x,y){const k=K(x,y);return G.rockSet.has(k)||(G.walls[k]>0);}
function log(s){G.log.push(s);if(G.log.length>120)G.log.shift();H.log(s);}

/* ---------------- MOVEMENT ---------------- */
function effMove(u){
  if(u.object||u.caged)return 0;
  let m=u.move+(u.side==='hero'&&hasR('boots')?1:0);
  if(u.st.slow)m=Math.min(m,1);
  if(u.st.prone)m=Math.floor(m/2);
  if(u.st.immob)m=0;
  if(u.moveCap!=null)m=Math.min(m,u.moveCap);
  return m;
}
function canReact(f){return live(f)&&!f.object&&!f.caged&&f.side!=='npc'&&!f.st.daze;}
function reactorsFor(u){return (u.side==='enemy'?heroes():foes()).filter(canReact);}
function passable(u,x,y){
  if(!inB(x,y)||blocked(x,y))return false;
  const o=unitAt(x,y);
  if(o&&o!==u&&(isFoe(u,o)||o.object))return false;
  return true;
}
/* Layered search: minimises free strikes provoked, then steps. */
function reach(u,mv){
  const nimble=!!u.nimble;
  const fs=nimble?[]:reactorsFor(u);
  const start={x:u.x,y:u.y,s:0,prov:0,prev:null};
  const layers=[[start]];
  for(let s=0;s<mv;s++){
    const next=new Map();
    for(const n of layers[s]){
      for(const[dx,dy]of DIRS){
        const x=n.x+dx,y=n.y+dy;
        if(!passable(u,x,y))continue;
        let p=n.prov;
        for(const f of fs)if(man(f,n)===1&&(Math.abs(f.x-x)+Math.abs(f.y-y))!==1)p++;
        const k=K(x,y);const ex=next.get(k);
        if(!ex||p<ex.prov)next.set(k,{x,y,s:s+1,prov:p,prev:n});
      }
    }
    layers.push([...next.values()]);
  }
  const best=new Map();
  for(const L of layers)for(const n of L){
    const o=unitAt(n.x,n.y);if(o&&o!==u)continue;
    const k=K(n.x,n.y);const ex=best.get(k);
    if(!ex||n.prov<ex.prov||(n.prov===ex.prov&&n.s<ex.s))best.set(k,n);
  }
  return best;
}
function pathOf(n){const p=[];while(n){p.unshift({x:n.x,y:n.y});n=n.prev;}return p;}
function freeTile(x,y,u){if(!inB(x,y)||blocked(x,y))return false;const o=unitAt(x,y);return !o||o===u;}
function freeAdj(t,u){const out=[];for(const[dx,dy]of DIRS)if(freeTile(t.x+dx,t.y+dy,u))out.push({x:t.x+dx,y:t.y+dy});return out;}
function tilesWithin(O,r){const out=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(Math.abs(x-O.x)+Math.abs(y-O.y)<=r)out.push({x,y});return out;}

async function walk(u,path,voluntary){
  const struck=new Set();
  for(let i=1;i<path.length;i++){
    const from=path[i-1],to=path[i];
    if(voluntary&&!u.nimble){
      const rs=reactorsFor(u).filter(f=>!struck.has(f.id)&&man(f,from)===1&&man(f,to)!==1);
      for(const f of rs){
        struck.add(f.id);u.provoked=true;
        await freeStrike(f,u);
        if(!live(u))return false;
        if(u.stopped){u.stopped=false;H.pop(u,'Stopped!','call');return false;}
      }
    }
    if(!freeTile(to.x,to.y,u)&&unitAt(to.x,to.y)&&i===path.length-1)return false;
    u.x=to.x;u.y=to.y;await H.step(u);
    onEnter(u);
  }
  return true;
}
function onEnter(u){
  if(u.side!=='hero'||!G.chests)return;
  const k=K(u.x,u.y);
  if(G.chests.includes(k)){G.chests=G.chests.filter(c=>c!==k);G.looted++;addRes(u,1);H.pop(u,'Treasure!','gold');H.sfx('chest');log(`${u.name} grabs a chest (${G.looted}/3).`);}
}
async function freeStrike(f,t){
  let d=f.side==='hero'?f.fs+(hasR('lens')?3:0):(f.fs||1)+TUNE.fsBonus+Math.floor(G.dmgAdd*TUNE.fsScale);
  log(`${f.name} makes a free strike on ${t.name}.`);
  await H.strike(f,t,{free:true});
  await damage(f,t,d,{});
  if(f.side==='hero'&&f.cls==='fighter'&&live(t)&&!t.object){t.stopped=true;applyTaunt(t,f);addRes(f,1);}
}
async function forceMove(t,from,n,pull,src,fl){
  if(t.object)return;
  n-=(t.stab||0);
  if(n<=0){H.pop(t,'Holds firm','call');return;}
  for(let i=0;i<n&&live(t);i++){
    let dx=t.x-from.x,dy=t.y-from.y;if(pull){dx=-dx;dy=-dy;}
    let sx=0,sy=0;
    if(Math.abs(dx)>=Math.abs(dy)&&dx!==0)sx=Math.sign(dx);else if(dy!==0)sy=Math.sign(dy);else break;
    const nx=t.x+sx,ny=t.y+sy;
    if(pull&&nx===from.x&&ny===from.y)break;
    if(!inB(nx,ny)||blocked(nx,ny)||unitAt(nx,ny)){
      if(!pull){const sd=2+(n-i-1);H.pop(t,'Slam!','call');H.sfx('slam');if(fl)fl.slam=true;await damage(src,t,sd,{});}
      break;
    }
    t.x=nx;t.y=ny;await H.step(t,true);
  }
}
async function teleport(u,to){await H.tele(u,to);u.x=to.x;u.y=to.y;H.upd(u);onEnter(u);}

/* ---------------- DAMAGE & CONDITIONS ---------------- */
function addRes(u,n){if(u.side==='hero'&&live(u))u.res=Math.min(10,u.res+n);}
async function damage(src,t,amt,o){
  if(!live(t)||amt<=0||t.caged)return 0;
  let a=amt;
  if(t.shield>0){const s=Math.min(t.shield,a);t.shield-=s;a-=s;}
  t.hp-=a;
  H.pop(t,a<amt?`-${a} 🛡`:`-${a}`,o.crit?'crit':'dmg');
  if(t.side==='hero'&&t.cls==='fighter'&&a>0)addRes(t,1);
  if(src&&src.side==='enemy'&&mon(src).drain&&a>0&&live(src))heal(src,Math.ceil(a/2));
  if(t.hp<=0)await kill(t,src,o);
  H.upd(t);
  return a;
}
function heal(t,n){if(!live(t)||n<=0||t.object)return 0;const b=t.hp;t.hp=Math.min(t.maxHp,t.hp+n);const g=t.hp-b;if(g>0)H.pop(t,'+'+g,'heal');H.upd(t);return g;}
async function kill(t,src,o){
  if(t.side==='hero'&&hasR('phoenix')&&!G.phoenixUsed){G.phoenixUsed=true;t.hp=Math.ceil(t.maxHp/2);H.pop(t,'Phoenix rises!','gold');H.sfx('heal');log(`${t.name} rises from the ashes!`);return;}
  t.dead=true;t.hp=0;t.shield=0;
  H.sfx(t.side==='hero'?'fall':t.object?'crumble':'death');
  log(t.side==='hero'?`${t.name} has fallen!`:`${t.name} is defeated.`);
  await H.death(t);
  if(t.side==='enemy'){
    if(!t.object&&RUN)RUN.stats.kills++;
    if(src&&src.side==='hero'&&hasR('fang'))heal(src,4);
    if(mon(t).reassemble&&!t.reassembled&&!(o&&o.radiant))t.reassembleAt=G.turn;
  }
}
function applyTaunt(t,src){
  if(t.object)return;
  t.st.taunt=Math.max(t.st.taunt||0,1+(((G.phase==='enemy')===(t.side==='enemy'))?1:0));t.taunter=src.id;
}
function applyEff(src,t,eff,tier){
  if(!eff||!live(t)||t.object)return;
  for(const k in eff){
    if(k==='push'||k==='pull')continue;
    let v=tv(eff[k],tier);if(!v)continue;
    if(k==='taunt'){applyTaunt(t,src);continue;}
    if(t.boss&&(k==='daze'||k==='immob'))continue;
    if(((G.phase==='enemy')===(t.side==='enemy')))v+=1;
    if(k==='bleed')t.bleedDmg=src.side==='hero'?3:2+G.act;
    t.st[k]=Math.max(t.st[k]||0,v);
  }
  H.upd(t);
}
function cleanse(t){for(const k of['slow','immob','weak','bleed','daze','prone','taunt'])delete t.st[k];H.upd(t);}
function decSt(u){for(const k in u.st){u.st[k]--;if(u.st[k]<=0){delete u.st[k];if(k==='taunt')u.taunter=null;}}}

/* ---------------- EDGES ---------------- */
function isMelee(p){return p.tgt==='self'||(p.tgt==='enemy'&&p.range===1)||!!p.reach||(!p.tgt&&p.range===1);}
function adjFoe(O,a){return G.units.some(o=>live(o)&&isFoe(a,o)&&!o.object&&!o.caged&&o.side!=='npc'&&man(o,O)===1);}
function netEdge(a,t,p,O){
  O=O||a;let e=0,b=0;const melee=isMelee(p);
  if(a.st.empower)e++;
  if(a.hidden)e+=2;
  if(p.edge)e++;
  if(t.st.expose||t.st.immob||t.st.daze||(t.st.prone&&melee))e++;
  if(a.side==='hero'){
    if(melee&&!t.object){
      if(a.cls==='rogue'){if(heroes().some(h=>h!==a&&man(h,t)===1))e++;}
      else{const h=unitAt(2*t.x-O.x,2*t.y-O.y);if(h&&h!==a&&h.side==='hero')e++;}
    }
  }else{
    const m=mon(a);
    if(m.pack&&foes().some(o=>o!==a&&man(o,t)===1))e++;
    if(foes().some(o=>o!==a&&mon(o).aura&&man(o,O)<=2))e++;
    if(a.brutal)e+=2;
    if(G.hordeEdge)e++;
    if(t.side==='hero'&&hasR('ward')&&!(t.warded||{})[a.id])b++;
  }
  if(a.st.weak)b++;
  if(a.st.prone)b++;
  if(a.st.taunt&&a.taunter&&a.taunter!==t.id&&live(U(a.taunter)))b++;
  if(!melee&&adjFoe(O,a))b++;
  return clamp(e,0,2)-clamp(b,0,2);
}
const sneak=a=>2+Math.floor(a.lvl/3);
function heroDmg(a,p,t,tier,net){
  if(p.noDmg)return 0;
  let d=p.dmg[tier-1]+a.char;
  if(hasR('whetstone'))d+=1;
  if(a.cls==='rogue'&&net>0)d+=sneak(a);
  if(p.radiant&&t.undead)d*=2;
  if(p.execute&&t.hp<=t.maxHp/2)d*=2;
  return d;
}
function monDmg(a,A,t,tier){
  if(A.flat!=null)return A.flat+Math.floor(G.dmgAdd/2);
  let d=A.dmg[tier-1]+G.dmgAdd;
  if(mon(a).savage&&t.hp<=t.maxHp/2)d+=2;
  return d;
}

/* ---------------- HERO POWERS ---------------- */
function powerOf(u,i){return POWERS[u.powers[i]];}
function usable(u,p){
  if(!p||p.cost>u.res)return false;
  if(p.revive&&!G.units.some(h=>h.side==='hero'&&h.dead))return false;
  return true;
}
function targetsFrom(u,p,O){
  const R=[];
  if(p.tgt==='enemy'){
    for(const e of enemiesAll()){const d=man(O,e);if(d>=1&&d<=p.range){if(p.teleportAdj&&!freeAdj(e,u).length)continue;R.push({x:e.x,y:e.y});}}
  }else if(p.tgt==='ally'){
    for(const a of friends()){
      if(a.object&&(p.refresh||p.swap))continue;
      if(a===u){if(!p.noSelf&&O.x===u.x&&O.y===u.y)R.push({x:u.x,y:u.y});continue;}
      if(p.refresh&&!(a.side==='hero'&&a.acted&&!a.canto))continue;
      if(man(O,a)<=p.range)R.push({x:a.x,y:a.y});
    }
  }else if(p.tgt==='tile'){
    for(const t of tilesWithin(O,p.range)){
      if(p.teleport&&(man(O,t)<1||blocked(t.x,t.y)||unitAt(t.x,t.y)))continue;
      if(p.wall&&(blocked(t.x,t.y)||unitAt(t.x,t.y)))continue;
      R.push(t);
    }
  }else if(p.tgt==='self')R.push({x:O.x,y:O.y});
  return R;
}
/* What a hero can do right now with power index pi. */
function heroView(u,pi){
  const V={moves:new Map(),targets:new Map(),zone:new Set(),R:null};
  if(!live(u)||G.phase!=='player'||G.over)return V;
  if(u.canto>0){V.R=reach(u,u.canto);V.R.forEach((n,k)=>V.moves.set(k,n));return V;}
  if(u.acted)return V;
  const p=u.side==='hero'?powerOf(u,pi):null;
  const canMove=!u.moved&&!(p&&p.tgt==='tile');
  if(canMove){V.R=reach(u,effMove(u));V.R.forEach((n,k)=>V.moves.set(k,n));}
  if(!p||!usable(u,p))return V;
  const here={x:u.x,y:u.y,s:0,prov:0,prev:null};
  const combo=canMove&&!u.st.daze&&(p.tgt==='enemy'||p.tgt==='ally');
  const origins=combo?[...V.moves.values()]:[here];
  for(const O of origins){
    for(const t of targetsFrom(u,p,O)){const k=K(t.x,t.y);if(!V.targets.has(k))V.targets.set(k,[]);V.targets.get(k).push(O);}
    if(p.tgt==='enemy'||p.tgt==='ally')for(const t of tilesWithin(O,p.range))V.zone.add(K(t.x,t.y));
  }
  return V;
}
function chooseOrigin(u,p,T,V,prefer){
  const os=V.targets.get(K(T.x,T.y));if(!os||!os.length)return null;
  if(prefer){const m=os.find(o=>o.x===prefer.x&&o.y===prefer.y);if(m)return m;}
  const score=o=>{
    let s=o.prov*10+o.s*.1;
    if(o.x===u.x&&o.y===u.y)s-=.5;
    if(p.tgt==='enemy'&&p.range>1&&!p.reach){s-=man(o,T)*.3;if(adjFoe(o,u))s+=3;}
    if(p.tgt==='enemy'&&isMelee(p)){const e=unitAt(T.x,T.y);if(e&&netEdge(u,e,p,o)>netEdge(u,e,p,u))s-=1.5;}
    return s;
  };
  return os.slice().sort((a,b)=>score(a)-score(b))[0];
}
function areaTargets(u,p,C){
  const r=p.area;
  if(p.aff==='ally')return friends().filter(a=>!a.object&&cheb(a,C)<=r);
  let L=enemiesAll().filter(e=>cheb(e,C)<=r&&!(p.tgt==='self'&&e.x===C.x&&e.y===C.y));
  if(p.aff==='undead')L=L.filter(e=>e.undead);
  return L;
}
/* Forecast rows for UI & bots. */
function forecast(u,p,T,O){
  O=O||u;const rows=[];
  const mk=t=>{
    if(p.noDmg){const net=netEdge(u,t,p,O);return {t,net,probs:tierProbs(charOf(u),net),dmg:[0,0,0],ctrl:true};}
    const net=netEdge(u,t,p,O);const probs=tierProbs(charOf(u),net);
    const dmg=[1,2,3].map(tier=>heroDmg(u,p,t,tier,net)*(p.hits||1));
    return {t,net,probs,dmg};
  };
  if(p.tgt==='enemy'){
    const t=unitAt(T.x,T.y);if(!t)return rows;
    rows.push(mk(t));
    if(p.chain){let last=t;const done=new Set([t.id]);for(let i=0;i<p.chain;i++){const nx=enemiesAll().filter(e=>!done.has(e.id)&&man(e,last)<=3).sort((a,b)=>man(a,last)-man(b,last))[0];if(!nx)break;done.add(nx.id);rows.push(mk(nx));last=nx;}}
  }else if(p.tgt==='ally'){
    const a=(T.x===u.x&&T.y===u.y)?u:unitAt(T.x,T.y);
    if(a)rows.push({t:a,heal:(p.heal?p.heal+(u.cls==='cleric'?u.char:0):0),shield:p.shield||0,refresh:p.refresh});
  }else if(p.tgt==='self'||(p.tgt==='tile'&&p.area)){
    const C=p.tgt==='self'?O:T;
    if(p.area){
      if(p.aff==='ally'){for(const a of areaTargets(u,p,C))rows.push({t:a,heal:p.heal?p.heal+(u.cls==='cleric'?u.char:0):0,shield:p.shield||0,empower:p.empower});}
      else for(const t of areaTargets(u,p,C))rows.push(mk(t));
    }
  }
  return rows;
}
function ev(row){if(!row.dmg)return 0;const hp=row.t.hp+row.t.shield;return row.probs.reduce((s,pr,i)=>s+pr*Math.min(hp,row.dmg[i]),0);}
function killP(row){if(!row.dmg)return 0;const hp=row.t.hp+row.t.shield;return row.probs.reduce((s,pr,i)=>s+(row.dmg[i]>=hp?pr:0),0);}

async function heroStrike(u,p,t,C,fl){
  const hits=p.hits||1;
  for(let h=0;h<hits&&live(t);h++){
    const net=netEdge(u,t,p,u);
    const r=rollTier(charOf(u),net);const tier=r.tier;
    const d=heroDmg(u,p,t,tier,net);
    if(u.cls==='rogue'&&net>0&&d>0)fl.sneak=true;
    H.tier(t,tier,r.crit);
    if(d>0)await damage(u,t,d,{crit:r.crit,radiant:p.radiant});
    fl.hitIds.add(t.id);
    if(!live(t))break;
    if(p.mark)applyTaunt(t,u);
    applyEff(u,t,p.eff,tier);
    const extra=u.cls==='wizard'?1:0;
    const push=tv(p.eff&&p.eff.push,tier),pull=tv(p.eff&&p.eff.pull,tier);
    if(push)await forceMove(t,C,push+extra,false,u,fl);
    if(pull&&live(t))await forceMove(t,C,pull+extra,true,u,fl);
  }
}
async function support(u,a,p,fl){
  if(p.heal){const g=heal(a,p.heal+(u.cls==='cleric'?u.char:0));if(g>0&&a!==u)fl.healedOther=true;}
  if(p.shield){a.shield+=p.shield;H.pop(a,'🛡 '+p.shield,'shield');}
  if(p.empower){a.st.empower=Math.max(a.st.empower||0,p.empower+1);H.pop(a,'Blessed','gold');}
  if(p.cleanse)cleanse(a);
  H.upd(a);
}
async function usePower(u,p,T){
  u.res-=p.cost;
  const fl={hitIds:new Set(),sneak:false,healedOther:false,slam:false};
  log(`${u.name}: ${p.name}.`);
  if(p.tgt==='enemy'){
    const t=unitAt(T.x,T.y);if(!t)return;
    if(p.teleportAdj){const spot=freeAdj(t,u).sort((a,b)=>man(a,u)-man(b,u))[0];if(spot)await teleport(u,spot);}
    await H.strike(u,t,{proj:p.proj,power:p});
    const pre={x:t.x,y:t.y};
    await heroStrike(u,p,t,{x:u.x,y:u.y},fl);
    if(p.follow&&live(u)&&!unitAt(pre.x,pre.y)&&(pre.x!==t.x||pre.y!==t.y||!live(t))&&man(u,pre)===1){u.x=pre.x;u.y=pre.y;await H.step(u);onEnter(u);}
    if(p.cleave&&live(u)){const o=foes().find(f=>f!==t&&man(f,u)===1);if(o){await H.strike(u,o,{});await damage(u,o,u.char+(hasR('whetstone')?1:0),{});}}
    if(p.chain){
      let last=t;const done=new Set([t.id]);
      for(let i=0;i<p.chain;i++){
        const nx=enemiesAll().filter(e=>!done.has(e.id)&&man(e,last)<=3).sort((a,b)=>man(a,last)-man(b,last))[0];
        if(!nx)break;done.add(nx.id);await H.strike(last,nx,{proj:p.proj,chain:true});await heroStrike(u,p,nx,{x:u.x,y:u.y},fl);last=nx;
      }
    }
  }else if(p.tgt==='ally'){
    const a=(T.x===u.x&&T.y===u.y)?u:unitAt(T.x,T.y);if(!a)return;
    if(p.swap){const ux=u.x,uy=u.y;u.x=a.x;u.y=a.y;a.x=ux;a.y=uy;await H.tele(u,u,true);H.upd(a);if(p.shield){u.shield+=p.shield;H.pop(u,'🛡 '+p.shield,'shield');}}
    if(p.refresh){a.acted=false;a.moved=false;a.canto=0;a.moveCap=null;H.pop(a,'Inspired!','gold');H.sfx('holy');}
    await support(u,a,p,fl);
  }else if(p.teleport){
    await teleport(u,T);
  }else if(p.wall){
    for(const dx of[-1,0,1]){const x=T.x+dx,y=T.y;if(inB(x,y)&&!blocked(x,y)&&!unitAt(x,y))G.walls[K(x,y)]=2;}
    await H.area(T,0,'ice');H.sfx('ice');
  }else if(p.revive){
    const f=G.units.filter(h=>h.side==='hero'&&h.dead).pop();
    const spot=freeAdj(u,u)[0]||tilesWithin(u,3).find(t=>freeTile(t.x,t.y,null));
    if(f&&spot){f.dead=false;f.hp=Math.ceil(f.maxHp*.4);f.x=spot.x;f.y=spot.y;f.st={};f.shield=0;f.acted=true;f.moved=true;H.spawn(f);H.sfx('holy');log(`${f.name} is revived!`);}
  }else if(p.area!=null&&!p.hide){
    const C=p.tgt==='self'?{x:u.x,y:u.y}:{x:T.x,y:T.y};
    await H.area(C,Math.min(p.area,8),p.fx||(p.aff==='ally'?'holy':'force'));
    if(p.pullFirst){for(const f of enemiesAll().filter(e=>cheb(e,C)<=p.area&&!e.object).sort((a,b)=>man(a,C)-man(b,C))){await forceMove(f,C,p.pullFirst,true,u,fl);if(live(f))applyTaunt(f,u);}}
    if(p.pullCenter){for(const f of enemiesAll().filter(e=>cheb(e,C)<=p.area&&!e.object).sort((a,b)=>man(a,C)-man(b,C)))await forceMove(f,C,p.pullCenter,true,u,fl);}
    let list=areaTargets(u,p,C);
    if(p.adjOnly)list=list.filter(t=>cheb(t,u)===1);
    const pushy=p.eff&&p.eff.push;
    list.sort((a,b)=>pushy?man(b,C)-man(a,C):man(a,C)-man(b,C));
    for(const t of list){if(p.aff==='ally')await support(u,t,p,fl);else await heroStrike(u,p,t,C,fl);}
    if(p.allyHeal)for(const a of friends().filter(a=>!a.object&&cheb(a,C)<=p.area)){const g=heal(a,p.allyHeal+(u.cls==='cleric'?u.char:0));if(g>0&&a!==u)fl.healedOther=true;}
    if(p.zone)G.zones.push({x:C.x,y:C.y,r:p.zone.r!=null?p.zone.r:1,rounds:2,dmg:p.zone.dmg,eff:p.zone.eff,radiant:!!p.zone.radiant,fx:p.fx});
  }
  if(p.selfHeal)heal(u,p.selfHeal);
  if(p.markAround)for(const f of foes().filter(e=>cheb(e,u)<=p.markAround))applyTaunt(f,u);
  if(p.healNear){const w=friends().filter(a=>!a.object&&man(a,u)<=3&&a.hp<a.maxHp).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];if(w){const g=heal(w,p.healNear);if(g>0&&w!==u)fl.healedOther=true;}}
  if(p.gainRes)addRes(u,p.gainRes);
  if(p.hide){u.hidden=true;H.pop(u,'Hidden','call');H.sfx('whoosh');}
  else if(u.hidden&&(p.tgt==='enemy'||(p.area&&p.aff!=='ally')))u.hidden=false;
  if(u.cls==='rogue'&&fl.sneak){addRes(u,1);H.pop(u,'+1 Insight','res');}
  if(u.cls==='wizard'&&(fl.hitIds.size>=2||fl.slam)){addRes(u,1);H.pop(u,'+1 Arcana','res');}
  if(u.cls==='cleric'&&fl.healedOther){addRes(u,1);H.pop(u,'+1 Faith','res');}
  H.upd(u);
}

/* ---------------- HERO ACTIONS (API) ---------------- */
function afterHero(u){
  const vil=G.units.find(v=>v.kind==='villager');
  if(vil&&vil.caged&&heroes().some(h=>man(h,vil)===1)){vil.caged=false;vil.acted=true;H.pop(vil,'Freed!','gold');H.sfx('chest');log('The captive is freed!');H.upd(vil);}
  if(G.enc.type==='breakout'&&u.side==='hero'&&live(u)&&u.y===0){u.gone=true;H.pop(u,'Escaped!','gold');H.sfx('holy');log(`${u.name} escapes!`);H.death(u);}
}
async function heroMove(u,dest){
  if(!live(u)||u.acted&&!u.canto||G.phase!=='player'||G.over)return false;
  const mv=u.canto>0?u.canto:effMove(u);
  if(!u.canto&&u.moved)return false;
  const R=reach(u,mv);const n=R.get(K(dest.x,dest.y));if(!n)return false;
  const before={x:u.x,y:u.y};u.provoked=false;
  await walk(u,pathOf(n),true);
  if(u.canto>0){u.canto=0;delete G.undo[u.id];}
  else{u.moved=true;if(!u.provoked&&live(u))G.undo[u.id]=before;else delete G.undo[u.id];}
  u.moveCap=null;
  if(u.st.daze&&!u.acted)u.acted=true;
  if(live(u))afterHero(u);
  await checkEnd();H.save();
  return true;
}
async function heroAct(u,pi,T,origin){
  const p=powerOf(u,pi);
  if(!live(u)||u.acted||!usable(u,p)||G.phase!=='player'||G.over)return false;
  if(origin&&(origin.x!==u.x||origin.y!==u.y)){
    if(u.moved)return false;
    await heroMove(u,origin);
    if(!live(u)||G.over||u.acted)return false;
    if(!targetsFrom(u,p,u).some(t=>t.x===T.x&&t.y===T.y))return false;
  }
  delete G.undo[u.id];
  await usePower(u,p,T);
  if(!p.free)u.acted=true;
  if(p.canto&&live(u))u.canto=p.canto;
  if(p.teleport)u.moved=true;
  if(p.freeMove){u.moved=false;u.moveCap=p.freeMove;}
  if(live(u))afterHero(u);
  await checkEnd();H.save();
  return true;
}
function heroWait(u){if(!live(u))return;u.acted=true;u.canto=0;delete G.undo[u.id];H.upd(u);H.save();}
function heroUndo(u){const b=G.undo[u.id];if(!b||u.acted)return false;u.x=b.x;u.y=b.y;u.moved=false;delete G.undo[u.id];H.upd(u);H.save();return true;}
function allDone(){return friends().filter(a=>!a.object&&!a.caged).every(a=>a.acted&&!a.canto);}

/* ---------------- ENEMY AI ---------------- */
function distField(sources){
  const d=new Map();const q=[];
  for(const s of sources){const k=K(s.x,s.y);if(!d.has(k)){d.set(k,0);q.push({x:s.x,y:s.y});}}
  while(q.length){const n=q.shift();const c=d.get(K(n.x,n.y));for(const[dx,dy]of DIRS){const x=n.x+dx,y=n.y+dy,k=K(x,y);if(!inB(x,y)||blocked(x,y)||d.has(k))continue;d.set(k,c+1);q.push({x,y});}}
  return d;
}
function monTargets(){return friends().filter(t=>!t.caged);}
function evMon(e,A,t,O){
  const net=netEdge(e,t,A,O);
  const probs=A.flat!=null?[0,1,0]:tierProbs(charOf(e),net);
  const hp=t.hp+t.shield;let evd=0,kp=0;
  for(let i=0;i<3;i++){const d=monDmg(e,A,t,i+1);evd+=probs[i]*Math.min(hp,d);if(d>=hp)kp+=probs[i];}
  return {ev:evd,kill:kp,net};
}
function planEnemy(e){
  const m=mon(e);const R=reach(e,effMove(e));
  const acts=m.acts.filter(A=>!A.cost||G.malice>=A.cost);
  const targets=monTargets();
  const type=G.enc.type;
  const vil=G.units.find(v=>v.kind==='villager'&&live(v)&&!v.caged);
  const wag=G.units.find(v=>v.kind==='wagon'&&live(v));
  let srcs=targets.filter(t=>!t.object);
  if(wag&&(e.id.charCodeAt(e.id.length-1)%3!==0))srcs=[wag];
  if(vil&&(e.id.charCodeAt(e.id.length-1)%2===0))srcs=[vil];
  if(type==='hold'&&e.id.charCodeAt(e.id.length-1)%2===0)srcs=srcs.concat(G.zoneTiles);
  if(!srcs.length)srcs=targets;
  const field=distField(srcs);
  const provCost=e.hp<=8?14:6;
  const ranged=m.acts[0]&&m.acts[0].range>1;
  let best={s:-1e9,node:null,act:null,target:null};
  for(const n of R.values()){
    const moved=n.x!==e.x||n.y!==e.y;
    let base=-n.prov*provCost;
    if(ranged)base-=heroes().filter(h=>man(h,n)===1).length*4;
    if(type==='hold'&&G.zoneSet.has(K(n.x,n.y)))base+=4;
    const fd=field.has(K(n.x,n.y))?field.get(K(n.x,n.y)):40;
    const mo=base-fd*1.5-(moved?0:.3);
    if(mo>best.s)best={s:mo,node:n,act:null,target:null};
    if(e.st.daze&&moved)continue;
    for(const A of acts){
      if(A.tgt==='ally'){
        for(const a of foes()){const miss=a.maxHp-a.hp;if(man(n,a)>A.range||miss<5)continue;const s=base+Math.min(miss,A.heal+G.dmgAdd)*1.1+(a.boss?4:0);if(s>best.s)best={s,node:n,act:A,target:a};}
        continue;
      }
      if(A.tgt==='self'){
        let s=-1e9;
        if(A.rally){const c=foes().filter(f=>f!==e&&man(f,e)<=3&&heroes().some(h=>man(h,f)===1)).length;s=base+c*4-A.cost*1.5;}
        if(A.malice)s=base+(targets.some(t=>man(t,n)<=4)?-5:3);
        if(s>best.s)best={s,node:n,act:A,target:e};
        continue;
      }
      for(const t of targets){
        const d=man(n,t);if(d<1||d>A.range)continue;
        const r=evMon(e,A,t,n);
        let s=base+r.ev*(t.side==='hero'?1+(1-t.hp/t.maxHp)*.5+(t.cls==='wizard'||t.cls==='cleric'?.25:0):1.3)+r.kill*(t.side==='hero'?22:35);
        if(t.kind==='villager'||t.kind==='wagon')s+=6;
        if(A.area)for(const o of monTargets())if(o!==t&&cheb(o,t)<=A.area){const r2=evMon(e,A,o,n);s+=r2.ev+r2.kill*15;}
        if(A.eff)s+=1.5;
        if(A.cost)s-=A.cost*1.3;
        if(e.st.taunt&&e.taunter&&e.taunter!==t.id){const F=U(e.taunter);if(live(F)&&man(F,n)===1)s-=F.fs+3;}
        if(s>best.s)best={s,node:n,act:A,target:t};
      }
    }
  }
  let brutal=false;
  if(best.act&&best.target&&!best.act.tgt&&best.act.flat==null&&G.malice>=3+(best.act.cost||0)){
    const r=evMon(e,best.act,best.target,best.node);
    const e2=Object.assign({},e,{brutal:true,st:e.st});
    const r2=evMon(e2,best.act,best.target,best.node);
    if(e.boss||r2.kill-r.kill>.25)brutal=true;
  }
  return {node:best.node,act:best.act,target:best.target,brutal};
}
async function monAttack(e,A,t){
  if(!live(t)||!live(e))return;
  if(A.cost)G.malice-=A.cost;
  if(A.tgt==='ally'){await H.strike(e,t,{support:true});heal(t,A.heal+G.dmgAdd);log(`${e.name} mends ${t.name}.`);return;}
  if(A.rally){H.pop(e,'Rally!','call');log(`${e.name} rallies its allies!`);for(const f of foes().filter(f=>f!==e&&man(f,e)<=3)){const h=heroes().find(h=>man(h,f)===1);if(h)await freeStrike(f,h);}return;}
  if(A.malice){H.pop(e,'Dark Offering','call');await damage(null,e,3,{});G.malice+=A.malice;return;}
  log(`${e.name}: ${A.name} on ${t.name}.`);
  await H.strike(e,t,{proj:A.range>1&&man(e,t)>1?(A.area?'#ff7a2a':'#ff9a7a'):null,monster:true});
  const victims=A.area?monTargets().filter(o=>cheb(o,t)<=A.area):[t];
  if(A.area)await H.area(t,A.area,'fire');
  for(const v of victims){
    if(!live(v))continue;
    const net=netEdge(e,v,A,e);
    const r=A.flat!=null?{tier:2,crit:false}:rollTier(charOf(e),net);
    if(v.side==='hero'&&hasR('ward')){v.warded=v.warded||{};v.warded[e.id]=1;}
    if(A.flat==null)H.tier(v,r.tier,r.crit);
    await damage(e,v,monDmg(e,A,v,r.tier),{crit:r.crit});
    if(!live(v))continue;
    applyEff(e,v,A.eff,r.tier);
    const push=tv(A.eff&&A.eff.push,r.tier),pull=tv(A.eff&&A.eff.pull,r.tier);
    if(push)await forceMove(v,e,push,false,e,null);
    if(pull&&live(v))await forceMove(v,e,pull,true,e,null);
  }
  // Defender's challenge
  if(e.st.taunt&&e.taunter&&e.taunter!==t.id&&live(e)){const F=U(e.taunter);if(live(F)&&F.cls==='fighter'&&man(F,e)===1&&canReact(F)){H.pop(F,'Challenge!','call');await freeStrike(F,e);}}
}
async function enemyTurn(e){
  const m=mon(e);
  if(e.object||!live(e))return;
  if(e.st.bleed){H.pop(e,'Bleed','bad');await damage(null,e,e.bleedDmg||3,{});if(!live(e))return;}
  if(m.summon&&G.turn%2===0&&foes().filter(f=>f.type===m.summon).length<2){const s=freeAdj(e,null)[0];if(s){H.pop(e,'Rise!','call');spawnEnemy(m.summon,s);await H.pause(250);}}
  const plan=planEnemy(e);
  if(!plan.node)return;
  if(plan.brutal){G.malice-=3;e.brutal=true;H.pop(e,'Brutal!','call');}
  const moved=plan.node.x!==e.x||plan.node.y!==e.y;
  if(moved){e.provoked=false;await walk(e,pathOf(plan.node),true);if(!live(e)){return;}}
  let A=plan.act,t=plan.target;
  if(A&&!(e.st.daze&&moved)){
    if(!A.tgt&&(!live(t)||man(e,t)>A.range||man(e,t)<1)){
      const alt=monTargets().filter(x=>{const d=man(e,x);return d>=1&&d<=A.range;}).sort((a,b)=>a.hp-b.hp)[0];t=alt;
    }
    if(t||A.tgt)await monAttack(e,A,t||e);
  }
  e.brutal=false;
  if(G.over||!live(e))return;
  const extra=(m.attacks||1)-1;
  for(let i=0;i<extra&&live(e)&&!G.over;i++){
    const opts=m.acts.filter(a=>!a.tgt&&(!a.cost||G.malice>=a.cost));
    let bb=null;
    for(const a of opts)for(const x of monTargets()){const d=man(e,x);if(d<1||d>a.range)continue;const r=evMon(e,a,x,e);const s=r.ev+r.kill*20-(a.cost||0)*1.3;if(!bb||s>bb.s)bb={s,a,x};}
    if(bb){await H.pause(160);await monAttack(e,bb.a,bb.x);}
  }
  if(m.skulk&&live(e)){const s=freeAdj(e,e).sort((a,b)=>minDist(b)-minDist(a))[0];if(s&&minDist(s)>minDist(e)){e.x=s.x;e.y=s.y;await H.step(e);}}
}
function minDist(p){let m=99;for(const h of friends())m=Math.min(m,man(h,p));return m;}

/* ---------------- VILLAIN ACTIONS ---------------- */
async function villain(b){
  const idx=[1,3,5].indexOf(G.turn);const va=mon(b).va&&mon(b).va[idx];if(!va)return;
  log(`${b.name}: ${VA[va].name}!`);H.sfx('villain');
  await H.banner('villain',b,VA[va]);
  const hs=heroes();
  switch(va){
    case 'horde':{for(let i=0;i<3;i++){const s=edgeSpot('top');if(s)spawnEnemy('runner',s);}G.hordeEdge=true;break;}
    case 'warcry':for(const h of hs.filter(h=>man(h,b)<=3)){applyEff(b,h,{weak:[1,1,1]},1);applyTaunt(h,b);}break;
    case 'laststand':heal(b,24);G.malice+=3;break;
    case 'raise':{for(let i=0;i<2;i++){const s=edgeSpot('top');if(s)spawnEnemy('bats',s);}const s=freeAdj(b,null)[0];if(s)spawnEnemy('skeleton',s);break;}
    case 'siphon':{let tot=0;for(const h of hs.filter(h=>man(h,b)<=4)){tot+=await damage(b,h,4,{});}heal(b,tot);break;}
    case 'nova':for(const h of hs){await damage(b,h,5,{});}break;
    case 'presence':for(const h of hs)applyEff(b,h,{weak:[1,1,1]},1);G.malice+=4;break;
    case 'buffet':for(const h of hs.filter(h=>cheb(h,b)<=2)){await damage(b,h,5,{});await forceMove(h,b,2,false,b,null);applyEff(b,h,{prone:[1,1,1]},1);}break;
    case 'inferno':{
      const rows={};for(const h of hs)rows[h.y]=(rows[h.y]||0)+1;
      const y=+Object.keys(rows).sort((a,b)=>rows[b]-rows[a])[0];
      await H.area({x:2.5,y},0,'row');
      for(const h of hs.filter(h=>Math.abs(h.y-y)<=0))await damage(b,h,10,{});
      for(const h of hs.filter(h=>Math.abs(h.y-y)===1))await damage(b,h,4,{});
      break;}
  }
}

/* ---------------- SPAWNING ---------------- */
function edgeSpot(where){
  const c=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(!freeTile(x,y,null))continue;
    const ok=where==='top'?y<=1:where==='bottom'?y===ROWS-1:where==='sides'?((x===0||x===COLS-1)&&y<=4):(y<=1||((x===0||x===COLS-1)&&y<=4));
    if(ok&&minDist({x,y})>=2)c.push({x,y});
  }
  return c.length?pick(c):null;
}
function makeEnemy(type,x,y,extra){
  const m=MON[type];const f=G.enc.f;
  const mult=m.boss?TUNE.bossHp*(1+.03*f):(m.object?1+.08*f:1+TUNE.hpSlope*f);
  const hp=Math.round(m.hp*mult*(extra&&extra.leader?1.6:1));
  return {id:'e'+(G.uid++),side:'enemy',type,name:(extra&&extra.leader?'Chief ':'')+m.name,x,y,hp,maxHp:hp,move:m.move,
    roll:(m.roll||0)+G.rollAdd+(extra&&extra.leader?1:0),fs:m.fs||1,stab:m.stab||0,st:{},shield:0,
    undead:!!m.undead,boss:!!m.boss,minion:!!m.minion,nimble:!!m.nimble,object:!!m.object,leader:!!(extra&&extra.leader),pillar:type==='pillar'};
}
function spawnEnemy(type,spot,extra){const e=makeEnemy(type,spot.x,spot.y,extra);G.units.push(e);H.spawn(e);return e;}

/* ---------------- ENCOUNTERS ---------------- */
function connected(rockKeys,from){
  const seen=new Set([K(from.x,from.y)]);const q=[from];
  while(q.length){const n=q.shift();for(const[dx,dy]of DIRS){const x=n.x+dx,y=n.y+dy,k=K(x,y);if(!inB(x,y)||rockKeys.has(k)||seen.has(k))continue;seen.add(k);q.push({x,y});}}
  return seen.size===COLS*ROWS-rockKeys.size;
}
const HERO_POS={
  normal:{fighter:[2,6],rogue:[3,6],cleric:[2,7],wizard:[3,7]},
  center:{fighter:[2,3],rogue:[3,3],cleric:[2,4],wizard:[3,4]},
  wagon:{fighter:[2,5],rogue:[3,6],cleric:[1,6],wizard:[2,7]},
};
function genEncounter(f,type){
  const act=Math.min(2,Math.floor(f/4));
  const M=MISSIONS[type];
  const enc={type,f,act,rocks:[],enemies:[],npcs:[],zone:[],chests:[],title:type==='boss'?MON[BOSSES[act]].name:pick(M.titles),
    heroPos:type==='ambush'?'center':type==='defend'?'wagon':'normal',reward:type==='boss'?'relic':pick(['power','relic','relic','rest'])};
  const reserved=new Set();
  const hp=HERO_POS[enc.heroPos];for(const c in hp)reserved.add(K(...hp[c]));
  if(type==='hold'){enc.zone=[[2,3],[3,3],[2,4],[3,4]];}
  if(type==='rescue'){const x=1+rnd(4);enc.npcs.push({kind:'villager',x,y:3});}
  if(type==='defend')enc.npcs.push({kind:'wagon',x:2,y:6});
  if(type==='ritual'){enc.enemies.push({type:'pillar',x:1,y:1},{type:'pillar',x:4,y:1});}
  enc.zone.forEach(z=>reserved.add(K(z[0],z[1])));
  enc.npcs.forEach(n=>reserved.add(K(n.x,n.y)));
  enc.enemies.forEach(n=>reserved.add(K(n.x,n.y)));
  // rocks
  const n=3+rnd(3);
  for(let tries=0;tries<80;tries++){
    const rocks=[];const used=new Set(reserved);
    let g=0;
    while(rocks.length<n&&g++<200){const x=rnd(COLS),y=1+rnd(6);const k=K(x,y);if(used.has(k))continue;if(type==='ambush'&&cheb({x,y},{x:2.5,y:3.5})<=1.5)continue;if(type==='rescue'&&man({x,y},enc.npcs[0])<=1)continue;used.add(k);rocks.push({x,y,v:rnd(4)});}
    const rk=new Set(rocks.map(r=>K(r.x,r.y)));
    if(connected(rk,{x:hp.fighter[0],y:hp.fighter[1]})){enc.rocks=rocks;break;}
  }
  enc.rocks.forEach(r=>reserved.add(K(r.x,r.y)));
  if(type==='loot'){const c=[];for(let y=1;y<=4;y++)for(let x=0;x<COLS;x++)if(!reserved.has(K(x,y)))c.push({x,y});shuffle(c);const ch=[];for(const t of c){if(ch.every(o=>man(o,t)>=3))ch.push(t);if(ch.length===3)break;}enc.chests=ch.map(t=>[t.x,t.y]);ch.forEach(t=>reserved.add(K(t.x,t.y)));}
  // enemies
  let budget=TUNE.budget0+TUNE.budgetSlope*f;
  const mult={hold:.7,survive:.6,defend:.65,rescue:.8,loot:.9,ritual:.75,assassinate:.8,ambush:1.1,breakout:.85,boss:TUNE.bossEscort,rout:1};
  budget*=mult[type]||1;
  const list=[];
  if(type==='boss')list.push({type:BOSSES[act],boss:true});
  if(type==='assassinate')list.push({type:LEADERS[act],leader:true});
  const pool=ACT_POOL[act];
  let g=0;
  while(list.length<9&&g++<80){
    const aff=pool.filter(t=>(MINION.includes(t)?2:MON[t].cost)<=budget&&!(type==='boss'&&MON[t].cost>=5));
    if(!aff.length)break;
    const t=pick(aff);
    if(MINION.includes(t)){for(let i=0;i<3&&list.length<9;i++)list.push({type:t});budget-=2;}
    else{list.push({type:t});budget-=MON[t].cost;}
  }
  let spots=[];
  const rowsFor=type==='rescue'?[0,1]:type==='breakout'?[1,2,3]:[0,1,2];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const k=K(x,y);if(reserved.has(k))continue;
    if(type==='ambush'){if((x===0||x===COLS-1||y===0||y===ROWS-1)&&cheb({x,y},{x:2.5,y:3.5})>=2)spots.push({x,y});}
    else if(rowsFor.includes(y))spots.push({x,y});
  }
  shuffle(spots);
  for(const e of list){
    let s;
    if(e.boss||e.leader)s=spots.find(t=>t.y===0&&(t.x===2||t.x===3))||spots.find(t=>t.y<=1)||spots[0];
    else s=spots[0];
    if(!s)break;
    spots=spots.filter(t=>t!==s);
    enc.enemies.push({type:e.type,x:s.x,y:s.y,leader:!!e.leader});
  }
  enc.budget=Math.round(TUNE.budget0+TUNE.budgetSlope*f);
  return enc;
}
function genChoices(f){
  if(f%4===3)return[genEncounter(f,'boss')];
  const act=Math.floor(f/4);
  let types=shuffle(MISSION_BY_ACT[act].slice());
  if(f===0)types=['rout',pick(['hold','loot','rescue'])];
  return[genEncounter(f,types[0]),genEncounter(f,types[1])];
}

async function startPlayerPhase(){
  if(G.over)return;
  G.turn++;G.phase='player';
  for(const e of enemiesAll())decSt(e);
  for(const k in G.walls){G.walls[k]--;if(G.walls[k]<=0)delete G.walls[k];}
  G.zones=G.zones.filter(z=>--z.rounds>0);
  G.hordeEdge=false;
  for(const a of friends()){
    a.shield=0;a.canto=0;a.moveCap=null;
    if(a.object){continue;}
    a.moved=false;a.acted=!!a.caged;
    if(a.side==='hero')addRes(a,TUNE.resTurn+(hasR('map')?1:0));
  }
  if(G.turn===1&&hasR('bulwark'))heroes().forEach(h=>h.shield=8);
  G.undo={};
  await H.banner('player');
  for(const a of friends())if(a.st.bleed){H.pop(a,'Bleed','bad');await damage(null,a,a.bleedDmg||3,{});}
  await checkEnd();
  H.save();
}
async function endPlayerTurn(){
  if(G.phase!=='player'||G.over)return;
  for(const a of friends()){a.acted=true;a.canto=0;}
  G.phase='enemy';
  for(const a of friends())decSt(a);
  G.malice+=1+Math.floor(G.turn*TUNE.maliceGain/2);
  await H.banner('enemy');
  // zones bite
  for(const z of G.zones)for(const f of enemiesAll().filter(e=>cheb(e,z)<=z.r&&!e.object)){
    await damage(null,f,(z.radiant&&f.undead?2:1)*z.dmg,{radiant:z.radiant});
    if(live(f)&&z.eff)applyEff({side:'hero'},f,{[z.eff]:[1,1,1]},1);
  }
  // reassemble
  for(const u of G.units)if(u.dead&&u.reassembleAt!=null&&u.reassembleAt<G.turn){u.reassembleAt=null;if(freeTile(u.x,u.y,null)){u.dead=false;u.reassembled=true;u.hp=Math.ceil(u.maxHp*.4);u.st={};H.spawn(u);H.pop(u,'Reassembles!','call');}}
  if(await checkEnd())return;
  const boss=foes().find(f=>f.boss);
  if(boss)await villain(boss);
  if(await checkEnd())return;
  const order=foes().sort((a,b)=>minDist(a)-minDist(b));
  for(const e of order){
    if(!live(e)||G.over)continue;
    await enemyTurn(e);
    if(await checkEnd())return;
    await H.pause(60);
  }
  G.round++;
  const E=G.enc;
  if(E.type==='hold'){
    const onZ=u=>G.zoneSet.has(K(u.x,u.y));
    if(heroes().some(onZ)&&!foes().some(onZ)){G.hold++;log(`The shrine is held (${G.hold}/3).`);H.pop(heroes().find(onZ),`Held ${G.hold}/3`,'gold');}
    else log('The shrine is contested.');
  }
  if(E.type==='ritual'&&!G.ritualFailed){
    G.ritual--;
    if(G.ritual<=0&&G.units.some(u=>u.pillar&&live(u))){
      G.ritualFailed=true;const p=G.units.find(u=>u.pillar&&live(u));
      for(const q of G.units.filter(u=>u.pillar&&live(u))){q.dead=true;H.death(q);}
      spawnEnemy('horror',{x:p.x,y:p.y});log('The ritual completes. A Bound Horror breaks free!');H.sfx('villain');
    }
  }
  if(await checkEnd())return;
  // reinforcements
  const cheap=ACT_POOL[E.act].filter(t=>!MINION.includes(t)&&MON[t].cost<=3);
  const add=(t,where)=>{const s=edgeSpot(where);if(s)spawnEnemy(t,s);};
  if(E.type==='hold'&&G.round%2===0&&G.round<6)for(let i=0;i<1+E.act;i++)add(pick(cheap),'top');
  if(E.type==='survive'&&G.round<5)for(let i=0;i<1+(G.round>=2)+(E.act>=2);i++)add(pick(cheap),'any');
  if(E.type==='defend'&&G.round<5)for(let i=0;i<1+(E.act>=1);i++)add(pick(cheap),'any');
  if(E.type==='breakout'&&G.round>=1)add(pick(cheap),'bottom');
  if(G.malice>=TUNE.maliceSummon&&foes().length<8&&G.turn>=2&&(G.summons||0)<=E.act){G.summons=(G.summons||0)+1;G.malice-=TUNE.maliceSummon;log('Malice summons reinforcements!');for(let i=0;i<3;i++)add(MINION[E.act],'any');}
  if(await checkEnd())return;
  await startPlayerPhase();
}
function outcome(){
  const E=G.enc;const hs=G.units.filter(u=>u.side==='hero');
  const standing=hs.filter(h=>!h.dead);
  if(!standing.length)return 'lose';
  if(E.type==='breakout'&&standing.every(h=>h.gone))return 'win';
  const vil=G.units.find(u=>u.kind==='villager');if(vil){if(vil.dead)return 'lose';if(!vil.caged&&vil.y===ROWS-1)return 'win';}
  const wag=G.units.find(u=>u.kind==='wagon');if(wag&&wag.dead)return 'lose';
  if(E.type==='boss')return G.units.some(u=>u.boss&&!u.dead)?null:'win';
  if(E.type==='assassinate'&&!G.units.some(u=>u.leader&&!u.dead))return 'win';
  if(E.type==='hold'&&G.hold>=3)return 'win';
  if((E.type==='survive'||E.type==='defend')&&G.round>=5)return 'win';
  if(E.type==='loot'&&G.chests.length===0)return 'win';
  if(E.type==='ritual'&&!G.ritualFailed&&!G.units.some(u=>u.pillar&&!u.dead))return 'win';
  if(!foes().length&&!(E.type==='ritual'&&G.units.some(u=>u.pillar&&!u.dead)))return 'win';
  return null;
}
async function checkEnd(){
  if(G.over)return true;
  const o=outcome();if(!o)return false;
  G.over=true;G.result=o;
  await H.end(o);
  return true;
}

/* ---------------- RUN ---------------- */
function newRun(){
  RUN={v:3,f:0,heroes:ORDER.map(c=>({cls:c,lvl:1,maxHp:CLASSES[c].hp,hp:CLASSES[c].hp,powers:CLASSES[c].start.slice()})),
    relics:[],equipped:[],choices:null,stage:'map',pending:null,battle:null,stats:{kills:0,wins:0}};
  return RUN;
}
function effMax(h){return h.maxHp+(hasR('heart')?8:0);}
function powerOffers(n){
  const cand=[];
  for(const h of RUN.heroes)for(const id in POWERS){const p=POWERS[id];if(p.c===h.cls&&p.lv<=h.lvl&&!h.powers.includes(id))cand.push({cls:h.cls,id});}
  shuffle(cand);const out=[];const seen=new Set();
  for(const c of cand){if(!seen.has(c.cls)){out.push(c);seen.add(c.cls);}if(out.length>=n)break;}
  for(const c of cand){if(out.length>=n)break;if(!out.includes(c))out.push(c);}
  return out;
}
function relicOffers(n){return shuffle(Object.keys(RELICS).filter(r=>!RUN.relics.includes(r))).slice(0,n);}
function resolveVictory(){
  const enc=G.enc;
  for(const h of RUN.heroes){
    const u=G.units.find(x=>x.id==='h_'+h.cls);
    const mhp=effMax(h);
    if(!u||u.dead)h.hp=Math.ceil(mhp*TUNE.fallenHp);
    else h.hp=Math.min(mhp,u.hp+Math.ceil(mhp*TUNE.healAfter));
    const g=CLASSES[h.cls].grow;h.lvl++;h.maxHp+=g;h.hp=Math.min(effMax(h),h.hp+g);
  }
  RUN.f++;RUN.stats.wins++;RUN.choices=null;RUN.battle=null;
  if(RUN.f>=TOTAL){RUN.stage='won';return;}
  if(RUN.f%4===0)RUN.heroes.forEach(h=>h.hp=Math.min(effMax(h),h.hp+Math.ceil(effMax(h)*TUNE.actHeal)));
  const steps=['train'];
  if(enc.reward==='power')steps.push('train');
  if(enc.reward==='relic')steps.push('relic');
  if(enc.reward==='rest')steps.push('rest');
  if(enc.type==='loot'&&G.looted>=3)steps.push('relic');
  RUN.pending={steps,offers:null,wasBoss:enc.type==='boss'};
  RUN.stage='reward';
}
function nextRewardStep(){
  const P=RUN.pending;if(!P||!P.steps.length){RUN.pending=null;RUN.stage='map';return null;}
  const s=P.steps[0];
  if(s==='train')P.offers=powerOffers(3);
  else if(s==='relic')P.offers=relicOffers(3);
  else P.offers=null;
  if((s==='train'||s==='relic')&&!P.offers.length){P.steps.shift();return nextRewardStep();}
  return s;
}
function takeReward(choice){
  const P=RUN.pending;const s=P.steps.shift();
  if(s==='train'&&choice){RUN.heroes.find(h=>h.cls===choice.cls).powers.push(choice.id);}
  if(s==='relic'&&choice){RUN.relics.push(choice);if(RUN.equipped.length<2)RUN.equipped.push(choice);}
  if(s==='rest'||choice==='rest')RUN.heroes.forEach(h=>h.hp=Math.min(effMax(h),h.hp+Math.ceil(effMax(h)*.7)));
  P.offers=null;
}
function toggleRelic(r){
  const i=RUN.equipped.indexOf(r);
  if(i>=0)RUN.equipped.splice(i,1);
  else{if(RUN.equipped.length>=2)RUN.equipped.shift();RUN.equipped.push(r);}
  RUN.heroes.forEach(h=>h.hp=Math.min(h.hp,effMax(h)));
}
function snapshot(){return JSON.parse(JSON.stringify(G,(k,v)=>(k==='rockSet'||k==='zoneSet'||k==='zoneTiles')?undefined:v));}
function restore(s){G=s;hydrate();}

function tone(f,d,type,v,f2,delay){const c=AU.ctx;if(!c)return;const t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AU.sfxG);o.start(t);o.stop(t+d+.05);}
function noiseBuf(){if(NB)return NB;const c=AU.ctx;NB=c.createBuffer(1,c.sampleRate,c.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return NB;}
function noise(d,v,ff,type,delay,ff2){const c=AU.ctx;if(!c)return;const t=c.currentTime+(delay||0);const s=c.createBufferSource();s.buffer=noiseBuf();const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(ff||1200,t);if(ff2)f.frequency.exponentialRampToValueAtTime(ff2,t+d);const g=c.createGain();g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(AU.sfxG);s.start(t);s.stop(t+d+.05);}
function sfx(n){
  if(!SET.sfx||!AU.ctx)return;
  switch(n){
    case 'hit':noise(.12,.35,1800,'lowpass');tone(160,.12,'square',.08,60);break;
    case 'crit':noise(.16,.45,2600);tone(180,.16,'square',.1,50);tone(1320,.2,'triangle',.08,null,.02);break;
    case 'heal':[660,880,1100].forEach((f,i)=>tone(f,.25,'sine',.09,null,i*.06));break;
    case 'holy':[784,988,1175,1568].forEach((f,i)=>tone(f,.35,'sine',.07,null,i*.05));break;
    case 'step':noise(.05,.06,500,'lowpass');break;
    case 'select':tone(560,.07,'triangle',.07);break;
    case 'click':tone(380,.05,'triangle',.06);break;
    case 'swing':noise(.12,.18,900,'bandpass',0,3000);break;
    case 'whoosh':noise(.3,.14,400,'bandpass',0,2400);break;
    case 'spell':tone(500,.3,'sine',.08,1400);noise(.25,.06,3000,'highpass');break;
    case 'fire':noise(.5,.35,900,'lowpass',0,200);tone(90,.4,'sawtooth',.06,50);break;
    case 'ice':tone(1600,.3,'sine',.07,900);tone(2200,.2,'triangle',.04,1200,.05);break;
    case 'slam':tone(90,.25,'square',.12,40);noise(.2,.3,600);break;
    case 'death':tone(320,.4,'sawtooth',.07,70);noise(.3,.12,700);break;
    case 'crumble':noise(.7,.3,500,'lowpass',0,120);break;
    case 'fall':tone(440,.8,'triangle',.1,110);tone(330,.8,'sine',.06,82,.1);break;
    case 'chest':[880,1320,1760].forEach((f,i)=>tone(f,.18,'triangle',.08,null,i*.07));break;
    case 'villain':tone(73,1.1,'sawtooth',.12);tone(77,1.1,'sawtooth',.1);noise(1,.1,300);break;
    case 'player':[392,523.3,659.3].forEach((f,i)=>tone(f,.4,'triangle',.08,null,i*.09));break;
    case 'enemy':[220,207.7,196].forEach((f,i)=>tone(f,.45,'sawtooth',.05,null,i*.12));break;
    case 'victory':[523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,.5,'triangle',.1,null,i*.13));tone(1046.5,1.2,'sine',.06,null,.52);break;
    case 'defeat':[392,330,262,196].forEach((f,i)=>tone(f,.6,'triangle',.09,null,i*.22));break;
  }
}
function musicStart(){
  if(!AU.ctx||MUS)return;AU.musG.gain.setTargetAtTime(.2,AU.ctx.currentTime,1.2);
  const chords=[[146.8,220,293.7],[116.5,174.6,233.1],[174.6,220,261.6],[130.8,196,261.6]];
  const scale=[293.7,349.2,392,440,523.3,587.3,698.5];let i=0;
  const bar=()=>{const c=AU.ctx,t=c.currentTime+.05;const ch=chords[i++%4];
    for(const f of ch)for(const det of[-5,5]){const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=det;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=650;const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.035,t+1.3);g.gain.linearRampToValueAtTime(.0001,t+4.4);o.connect(fl);fl.connect(g);g.connect(AU.musG);o.start(t);o.stop(t+4.5);}
    const o=c.createOscillator();o.type='sine';o.frequency.value=ch[0]/2;const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.08,t+.4);g.gain.linearRampToValueAtTime(.0001,t+4);o.connect(g);g.connect(AU.musG);o.start(t);o.stop(t+4.1);
    for(let k=0;k<6;k++){if(Math.random()<.55){const f=scale[Math.floor(Math.random()*scale.length)]*(Math.random()<.25?2:1);const p=c.createOscillator();p.type='triangle';p.frequency.value=f;const pg=c.createGain();const tt=t+k*.66+Math.random()*.08;pg.gain.setValueAtTime(.0001,tt);pg.gain.exponentialRampToValueAtTime(.05,tt+.01);pg.gain.exponentialRampToValueAtTime(.0001,tt+1.4);p.connect(pg);pg.connect(AU.musG);p.start(tt);p.stop(tt+1.5);}}
    for(const k of[0,2]){const tt=t+k;noise(.25,.12,140,'lowpass',tt-c.currentTime);}
  };
  bar();MUS=setInterval(bar,4000);
}
function musicStop(){if(MUS){clearInterval(MUS);MUS=null;}if(AU.ctx)AU.musG.gain.setTargetAtTime(0,AU.ctx.currentTime,.3);}
</script>
<script>
/* =====================================================================
   UI
   ===================================================================== */
const $=s=>document.querySelector(s);
const SAVE_KEY='emberwatch.v2',SET_KEY='emberwatch.settings';
let SET={music:true,sfx:true,fast:false,theme:'auto'};
try{Object.assign(SET,JSON.parse(localStorage.getItem(SET_KEY)||'{}'));}catch(e){}
function saveSet(){try{localStorage.setItem(SET_KEY,JSON.stringify(SET));}catch(e){}}
function applyTheme(){const r=document.documentElement;if(SET.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',SET.theme);}
applyTheme();
const spd=()=>(SET.fast?.5:1)*(window.__SPEED||1);
const sleep=ms=>new Promise(r=>setTimeout(r,ms*spd()));
let S=48;const TOK={};
const UI={sel:null,pi:0,pend:null,busy:false,danger:false,inspect:null,drag:null,ptr:null,lastSel:null};
const STI={slow:'🐌',immob:'⛓️',prone:'⤵️',daze:'💫',weak:'💧',bleed:'🩸',expose:'🎯',taunt:'📍',empower:'✨'};
const STN={slow:'Slowed',immob:'Immobilized',prone:'Prone',daze:'Dazed',weak:'Weakened',bleed:'Bleeding',expose:'Exposed',taunt:'Marked',empower:'Blessed'};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}
document.addEventListener('pointerdown',()=>auInit(),{capture:true});

/* ---------- save ---------- */
function saveGame(){
  try{
    if(!RUN||RUN.stage==='lost')return;
    if(RUN.stage==='battle'&&G&&G.over)return;
    if(RUN.stage==='battle'&&G&&!G.over&&G.phase==='player')RUN.battle=snapshot();
    if(RUN.stage!=='battle')RUN.battle=null;
    localStorage.setItem(SAVE_KEY,JSON.stringify(RUN));
  }catch(e){}
}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return d&&d.v===3?d:null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

/* ---------- engine hooks ---------- */
function tokC(u){return[(u.x+.5)*S,(u.y+.5)*S];}
let popN=0,popT=0;
H.step=async(u,forced)=>{renderUnits();sfx('step');await sleep(forced?110:135);};
H.strike=async(a,t,o)=>{
  if(!t||!TOK[a.id])return;
  if(o&&o.support){sfx('holy');await sleep(200);return;}
  if(o&&o.proj){sfx(o.power&&o.power.fx==='fire'?'fire':'spell');await projectile(a,t,o.proj);}
  else{sfx('swing');await lunge(a,t);}
  hitFlash(t);
};
H.area=async(C,r,kind)=>{areaFlash(C,r,kind);sfx(kind==='fire'?'fire':kind==='ice'||kind==='web'?'ice':kind==='holy'?'holy':'spell');await sleep(280);};
H.tele=async(u,to)=>{const t=TOK[u.id];if(t)t.style.opacity='0';sfx('whoosh');await sleep(160);renderUnits(true);if(t)t.style.opacity='';await sleep(120);};
H.death=async(u)=>{renderUnits();await sleep(240);};
H.pause=ms=>sleep(ms);
H.pop=(u,txt,cls)=>popup(u,txt,cls);
H.tier=(t,tier,crit)=>{popup(t,crit?'Critical!':'Tier '+tier,'tier t'+tier);sfx(crit?'crit':'hit');};
H.sfx=n=>sfx(n);
H.upd=()=>{renderUnits();renderTop();};
H.spawn=()=>{renderUnits();renderObjs();};
H.save=()=>saveGame();
H.log=()=>{};
H.banner=async(kind,b,va)=>{
  if(kind==='player'){sfx('player');renderAll();await banner('Your turn','Turn '+G.turn,'player');}
  else if(kind==='enemy'){sfx('enemy');renderAll();await banner('Enemy phase','Malice '+G.malice,'enemy');}
  else if(kind==='villain')await banner(va.name,va.desc,'villain',artOf(b));
};
H.end=async o=>{renderAll();await sleep(450);showOutcome(o);};

async function banner(t,sub,cls,art){
  const b=$('#banner');b.className='on '+(cls||'');
  b.innerHTML=(art?`<div class="bp">${art}</div>`:'')+`<div class="bt">${t}</div>`+(sub?`<div class="bs">${sub}</div>`:'');
  await sleep(cls==='villain'?1700:850);b.className='';await sleep(120);
}
function popup(u,txt,cls){
  const now=performance.now();if(now-popT>450)popN=0;popT=now;
  const[x,y]=tokC(u);const p=document.createElement('div');p.className='pop '+(cls||'');p.textContent=txt;
  p.style.left=x+'px';p.style.top=(y-S*.3-popN*S*.26)+'px';popN++;
  $('#fx').appendChild(p);setTimeout(()=>p.remove(),1300);
}
async function projectile(a,t,color){
  const[x1,y1]=tokC(a),[x2,y2]=tokC(t);const p=document.createElement('div');p.className='proj';
  p.style.background=color;p.style.boxShadow=`0 0 10px 4px ${color}`;p.style.transform=`translate(${x1}px,${y1}px)`;
  $('#fx').appendChild(p);p.getBoundingClientRect();
  const dur=Math.min(340,120+Math.hypot(x2-x1,y2-y1)*.8)*spd();
  p.style.transition=`transform ${dur}ms linear`;p.style.transform=`translate(${x2}px,${y2}px)`;
  await new Promise(r=>setTimeout(r,dur));p.remove();
}
async function lunge(a,t){const tk=TOK[a.id];if(!tk)return;const dx=(t.x-a.x)*S*.3,dy=(t.y-a.y)*S*.3;tk.style.transform=`translate(${a.x*S+dx}px,${a.y*S+dy}px)`;await sleep(110);tk.style.transform=`translate(${a.x*S}px,${a.y*S}px)`;await sleep(70);}
function hitFlash(t){const tk=TOK[t.id];if(!tk)return;tk.classList.remove('hit');void tk.offsetWidth;tk.classList.add('hit');}
function areaFlash(C,r,kind){
  const d=document.createElement('div');d.className='aflash '+kind;
  if(kind==='row'){d.style.left='0px';d.style.top=(C.y*S)+'px';d.style.width=S*COLS+'px';d.style.height=S+'px';}
  else{const rr=Math.min(r,7);d.style.left=(C.x-rr)*S+'px';d.style.top=(C.y-rr)*S+'px';d.style.width=d.style.height=(2*rr+1)*S+'px';}
  $('#fx').appendChild(d);setTimeout(()=>d.remove(),700);
}

/* ---------- board rendering ---------- */
function sizeBoard(){
  const r=$('#bwrap').getBoundingClientRect();
  S=Math.max(30,Math.floor(Math.min(r.width/COLS,r.height/ROWS)));
  const b=$('#board');b.style.width=S*COLS+'px';b.style.height=S*ROWS+'px';b.style.setProperty('--s',S);
  $('#paths').setAttribute('viewBox',`0 0 ${S*COLS} ${S*ROWS}`);
  if(G){drawTerrain();renderAll(true);}
}
window.addEventListener('resize',()=>{if($('#sBattle').classList.contains('on'))sizeBoard();});
function renderUnits(instant){
  if(!G)return;const layer=$('#units');
  for(const u of G.units){
    let t=TOK[u.id];
    if(!t){t=document.createElement('div');t.innerHTML=`<div class="med">${artOf(u)}</div><div class="cage"></div><div class="hp"><i></i></div><div class="hpn"></div><div class="sts"></div><div class="shd"></div>`;layer.appendChild(t);TOK[u.id]=t;instant=true;}
    const gone=!live(u);
    t.className='tok '+u.side+(u.boss?' boss':'')+(u.leader?' leader':'')+(u.object?' obj':'')+(gone?' dead':'')+(UI.sel===u.id?' sel':'')+(UI.inspect===u.id?' insp':'')
      +((u.side!=='enemy')&&G.phase==='player'&&u.acted&&!u.canto&&!u.object&&!u.caged?' acted':'')+(u.caged?' caged':'')+(u.hidden?' hidden':'')+(UI.drag&&UI.drag.id===u.id?' drag':'');
    t.style.width=t.style.height=S+'px';
    if(instant){t.style.transition='none';requestAnimationFrame(()=>requestAnimationFrame(()=>{t.style.transition='';}));}
    if(!(UI.drag&&UI.drag.id===u.id))t.style.transform=`translate(${u.x*S}px,${u.y*S}px)`;
    t.querySelector('.hp i').style.width=Math.max(0,u.hp/u.maxHp*100)+'%';
    t.querySelector('.hpn').textContent=Math.max(0,u.hp);
    t.querySelector('.sts').textContent=Object.keys(u.st).map(k=>STI[k]||'').join('');
    const sd=t.querySelector('.shd');sd.textContent=u.shield>0?'🛡'+u.shield:'';sd.style.display=u.shield>0?'':'none';
  }
  for(const id in TOK)if(!G.units.find(u=>u.id===id)){TOK[id].remove();delete TOK[id];}
}
function renderObjs(){
  if(!G)return;let h='';
  for(const k of(G.chests||[])){const x=k%COLS,y=Math.floor(k/COLS);h+=`<div class="chest" style="left:${x*S}px;top:${y*S}px;width:${S}px;height:${S}px">${CHEST}</div>`;}
  for(const k in G.walls){const n=+k,x=n%COLS,y=Math.floor(n/COLS);h+=`<div class="wall" style="left:${x*S+3}px;top:${y*S+3}px;width:${S-6}px;height:${S-6}px"></div>`;}
  for(const z of G.zones){const r=z.r;h+=`<div class="zone ${z.fx||'arcane'}" style="left:${(z.x-r)*S}px;top:${(z.y-r)*S}px;width:${(2*r+1)*S}px;height:${(2*r+1)*S}px"></div>`;}
  $('#objs').innerHTML=h;
}
function selUnit(){const u=UI.sel&&U(UI.sel);return u&&live(u)?u:null;}
function view(){const u=selUnit();if(!u)return null;return heroView(u,u.side==='hero'?UI.pi:0);}
function enemyRange(e){const m=mon(e);const R=reach(e,effMove(e));const mv=new Set(R.keys());const at=new Set();const rng=Math.max(0,...m.acts.filter(a=>!a.tgt).map(a=>a.range));for(const n of R.values())for(const t of tilesWithin(n,rng))if(man(t,n)>=1)at.add(K(t.x,t.y));return{mv,at};}
function renderHL(V){
  let h='';const add=(x,y,c)=>{h+=`<div class="h ${c}" style="left:${x*S+2}px;top:${y*S+2}px;width:${S-4}px;height:${S-4}px"></div>`;};
  const kx=k=>k%COLS,ky=k=>Math.floor(k/COLS);
  if(UI.danger){const m=new Map();for(const e of foes()){enemyRange(e).at.forEach(k=>m.set(k,1));}m.forEach((v,k)=>add(kx(k),ky(k),'dz'));}
  const u=selUnit();
  if(UI.inspect&&!u){const e=U(UI.inspect);if(live(e)&&e.side==='enemy'&&!e.object){const{mv,at}=enemyRange(e);at.forEach(k=>{if(!mv.has(k))add(kx(k),ky(k),'rg');});mv.forEach(k=>add(kx(k),ky(k),'emv'));}}
  if(u&&V){
    const p=u.side==='hero'?powerOf(u,UI.pi):null;
    const tcls=!p?'at':p.tgt==='enemy'?'at':p.tgt==='tile'&&p.area!=null?'ar':'as';
    V.zone.forEach(k=>{if(!V.moves.has(k)&&!V.targets.has(k))add(kx(k),ky(k),'rg');});
    V.moves.forEach(n=>{const o=unitAt(n.x,n.y);if(o&&o!==u)return;if(n.x===u.x&&n.y===u.y)return;add(n.x,n.y,'mv');});
    V.targets.forEach((os,k)=>{if(p&&p.tgt==='self')return;add(kx(k),ky(k),tcls);});
    if(p&&p.tgt==='self'&&p.area!=null&&!u.acted&&usable(u,p)){for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(cheb({x,y},u)<=p.area&&!(x===u.x&&y===u.y))add(x,y,'aoe');}
    if(UI.pend){const T=UI.pend.T;
      if(p&&p.area!=null&&p.tgt==='tile')for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(cheb({x,y},T)<=p.area)add(x,y,'aoe');
      if(p&&p.wall)for(const dx of[-1,0,1])if(inB(T.x+dx,T.y))add(T.x+dx,T.y,'aoe');
      add(T.x,T.y,'pend');}
  }
  $('#hl').innerHTML=h;
}
function provPins(path,u){
  const pins=[];if(!path||u.nimble)return pins;const struck=new Set();
  for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];for(const f of reactorsFor(u))if(!struck.has(f.id)&&man(f,a)===1&&man(f,b)!==1){struck.add(f.id);pins.push(a);}}
  return pins;
}
function drawPath(path,u){
  const sv=$('#paths');
  if(!path||path.length<2){sv.innerHTML='';return;}
  const pins=provPins(path,u);const warn=pins.length>0;
  const pts=path.map(p=>[(p.x+.5)*S,(p.y+.5)*S]);
  const[x1,y1]=pts[pts.length-2],[x2,y2]=pts[pts.length-1];
  const a=Math.atan2(y2-y1,x2-x1),ca=Math.cos(a),sa=Math.sin(a);
  const L=S*.34,Wd=S*.24;
  const bx=x2-ca*L*.35,by=y2-sa*L*.35;
  const body=pts.slice(0,-1).concat([[bx,by]]);
  const d='M'+body.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
  const tip=[x2+ca*L*.55,y2+sa*L*.55],l=[bx-sa*Wd,by+ca*Wd],r=[bx+sa*Wd,by-ca*Wd];
  const tri=[tip,l,r].map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const col=warn?'#ff6a5a':'#7cc4ff',core=warn?'#ffe0da':'#f0f9ff';
  sv.innerHTML=`<defs><filter id="pgl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${(S*.07).toFixed(1)}"/></filter></defs>
  <g filter="url(#pgl)" opacity=".85"><path d="${d}" stroke="${col}" stroke-width="${S*.3}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polygon points="${tri}" fill="${col}"/></g>
  <path d="${d}" stroke="${col}" stroke-width="${S*.18}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${d}" stroke="${core}" stroke-width="${S*.07}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="${tri}" fill="${col}" stroke="${core}" stroke-width="${S*.035}" stroke-linejoin="round"/>`+
  pins.map(p=>`<g><circle cx="${(p.x+.5)*S}" cy="${(p.y+.5)*S}" r="${S*.16}" fill="#e5484d" stroke="#fff" stroke-width="2"/><text x="${(p.x+.5)*S}" y="${(p.y+.5)*S+S*.07}" text-anchor="middle" font-size="${S*.22}" font-weight="900" fill="#fff" font-family="sans-serif">!</text></g>`).join('');
}

/* ---------- top, info, tray ---------- */
function objText(){
  const E=G.enc,t=E.type,n=foes().length;
  switch(t){
    case 'hold':return `Hold the shrine ${G.hold}/3`;
    case 'loot':return `Chests ${G.looted}/3`;
    case 'survive':return `Survive, round ${Math.min(5,G.round+1)}/5`;
    case 'defend':return `Defend the wagon, round ${Math.min(5,G.round+1)}/5`;
    case 'rescue':{const v=G.units.find(u=>u.kind==='villager');return v&&v.caged?'Reach the captive':'Lead the captive south';}
    case 'ritual':return G.ritualFailed?'Slay the Bound Horror':`Topple pillars, ${G.ritual} rounds left`;
    case 'breakout':return `Escape north, ${G.units.filter(u=>u.gone).length} out`;
    case 'assassinate':return 'Slay the chief';
    case 'boss':return 'Defeat '+E.title;
    default:return `${n} ${n===1?'foe':'foes'} left`;
  }
}
function renderTop(){
  if(!G)return;
  $('#bObj').innerHTML=`<span>${MISSIONS[G.enc.type].icon}</span><span>${objText()}</span>`;
  $('#malice').innerHTML=`<span>◆</span><span>${Math.max(0,G.malice)}</span>`;
  $('#turn').textContent='Turn '+G.turn;
}
function pips(u){let h='';for(let i=0;i<Math.max(6,u.res);i++)h+=`<i class="${i<u.res?'on':''}"></i>`;return h;}
function hpBar(u){return `<div class="hpline"><div class="bar"><i style="width:${Math.max(0,u.hp/u.maxHp*100)}%"></i></div><span>${Math.max(0,u.hp)}/${u.maxHp}</span></div>`;}
function stChips(u){const k=Object.keys(u.st);let h=k.map(s=>`<span>${STI[s]} ${STN[s]}</span>`).join('');if(u.shield>0)h+=`<span>🛡 ${u.shield}</span>`;if(u.hidden)h+='<span>👁 Hidden</span>';return h?`<div class="stchips">${h}</div>`:'';}
function tiersOf(u,p){if(!p.dmg||p.noDmg)return '';const b=u.char+(hasR('whetstone')?1:0);return p.dmg.map(d=>d+b).join('/')+(p.hits>1?` ×${p.hits}`:'');}

function setPend(k,quiet){

async function doPending(){

async function doMove(u,n){
