name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Emberwatch and Paragon (dnd4e/) are static: pages plus scripts, no build step.
      - run: mkdir _site && cp -r index.html js dnd4e _site/
      # Bust phone caches: every deploy loads fresh scripts, and Paragon's offline cache is renewed.
      - run: sed -i "s/?v=BUILD/?v=${GITHUB_SHA::8}/g" _site/index.html _site/dnd4e/index.html
      - run: sed -i "s/paragon-BUILD/paragon-${GITHUB_SHA::8}/" _site/dnd4e/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
