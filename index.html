<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#071426" />
    <meta name="description" content="Build and play a touch-friendly fantasy tactics encounter." />
    <title>Tactics — Encounter Builder</title>
  </head>
  <body>
    <section id="title-screen" class="title-screen" aria-label="Encounter setup">
      <div class="title-backdrop"></div>
      <form id="encounter-form" class="encounter-card">
        <p class="title-kicker">FIELD COMMAND</p>
        <h1>Tactics</h1>
        <p class="title-copy">Assemble your company and shape the battlefield.</p>
        <label class="setup-field">
          <span>Battlefield</span>
          <select id="map-size">
            <option value="6x8">6 × 8 · Meadow</option>
            <option value="12x16">12 × 16 · Desert</option>
            <option value="20x20">20 × 20 · Snowfield</option>
            <option value="30x30">30 × 30 · Highlands</option>
          </select>
        </label>
        <div class="setup-grid">
          <label class="setup-field"><span>Move speed</span><input id="move-speed" type="number" min="2" max="8" value="3" inputmode="numeric" /></label>
          <label class="setup-field"><span>Enemies</span><input id="enemy-count" type="number" min="1" max="16" value="4" inputmode="numeric" /></label>
          <label class="setup-field"><span>Heroes</span><input id="player-count" type="number" min="1" max="6" value="2" inputmode="numeric" /></label>
        </div>
        <div class="roster-preview" aria-label="Available heroes">
          <span class="preview-hero sprite-alden" title="Aldren, Archer"></span>
          <span class="preview-hero sprite-mira" title="Mira, Healer"></span>
          <span class="preview-hero sprite-lyra" title="Lyra, Wizard"></span>
          <span class="preview-hero sprite-nox" title="Nox, Thief"></span>
          <span class="preview-hero sprite-seraphine" title="Seraphine, Paladin"></span>
          <span class="preview-hero sprite-garrick" title="Garrick, Fighter"></span>
        </div>
        <button class="new-encounter-button" type="submit">New Encounter</button>
      </form>
    </section>

    <main id="game-shell" class="game-shell" aria-label="Tactics battle" hidden>
      <section class="battlefield-viewport">
        <div id="battlefield-frame" class="battlefield-frame"><div id="battlefield" class="battlefield" aria-label="Tactical battlefield"></div></div>
        <div id="combat-log-panel" class="combat-log-panel" hidden>
          <div class="combat-log-heading"><strong>Combat Log</strong><button id="log-close" type="button" aria-label="Close combat log">×</button></div>
          <div id="combat-log-list" class="combat-log-list"></div>
        </div>
        <div id="result-overlay" class="result-overlay" hidden>
          <p class="eyebrow">BATTLE COMPLETE</p><h2 id="result-title">Victory</h2><p id="result-copy">The field is secure.</p>
          <button id="restart-overlay" class="primary-button" type="button">Play again</button>
          <button id="setup-overlay" class="secondary-button" type="button">New setup</button>
        </div>
        <div class="hud-left">
          <div id="utility-panel" class="utility-panel" hidden>
            <button id="setup-action" class="hud-circle" type="button" aria-label="Return to encounter setup" title="Encounter setup">⚙</button>
            <button id="stats-toggle" class="hud-circle" type="button" aria-label="Show selected unit stats" aria-expanded="false" title="Character sheet"><svg class="hud-icon sheet-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8" cy="9" r="2"></circle><path d="M5.5 15c.8-2 4.2-2 5 0M13 8h5M13 12h5M13 16h4"></path></svg></button>
            <button id="log-toggle" class="hud-circle" type="button" aria-label="Open combat log" aria-expanded="false" title="Combat log"><span class="speech-icon" aria-hidden="true"></span></button>
            <button id="undo-action" class="hud-circle" type="button" aria-label="Undo last player decision" title="Undo">↶</button>
            <button id="zoom-reset" class="hud-circle zoom-reset" type="button" aria-label="Return to default zoom" title="Default zoom"><span class="zoom-out-icon" aria-hidden="true">−</span></button>
          </div>
          <button id="utility-toggle" class="hud-circle utility-toggle" type="button" aria-label="Show game controls" aria-expanded="false" title="Controls"><svg class="chevron-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 14.5 5.5-5 5.5 5"></path></svg></button>
        </div>
        <aside id="initiative-drawer" class="initiative-drawer" aria-label="Initiative order" aria-hidden="true">
          <div id="initiative-rail" class="initiative-rail" role="list"></div>
        </aside>
        <div class="hud-right">
          <button id="rail-toggle" class="hud-circle rail-toggle" type="button" aria-label="Show initiative order" aria-expanded="false" title="Initiative order"><svg class="hud-icon roster-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="5" r="2"></circle><circle cx="5" cy="12" r="2"></circle><circle cx="5" cy="19" r="2"></circle><path d="M9 5h10M9 12h10M9 19h10"></path></svg></button>
        </div>
        <div id="action-hotbar" class="action-hotbar" role="toolbar" aria-label="Actions for the active hero"></div>
      </section>
      <p class="sr-only" id="instruction" aria-live="polite"></p>
    </main>

    <aside class="unit-drawer" id="unit-drawer" aria-label="Selected unit stats" hidden>
      <div class="drawer-content">
        <span class="label" id="selected-team">Hero</span>
        <div class="drawer-heading"><div class="portrait" id="portrait" aria-hidden="true"></div><div><strong id="selected-name">Aldren</strong><small id="selected-class">Archer</small></div></div>
        <dl class="stat-list">
          <div><dt>HP</dt><dd id="health-text">5 / 5</dd></div>
          <div><dt>Attack</dt><dd id="attack-stat">2</dd></div>
          <div><dt>Move</dt><dd id="movement-stat">3</dd></div>
          <div><dt>Initiative</dt><dd id="initiative-stat">+2</dd></div>
        </dl>
      </div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/canvasBattlefield.ts"></script>
  </body>
</html>
