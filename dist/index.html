<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="A portrait-first, touch-friendly tactical battle prototype." />
    <title>Tactics — First Battle</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Tactics battle">
      <header class="game-status" aria-label="Turn status">
        <details class="settings-menu" id="settings-menu">
          <summary aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Zm8.2 4.7v-2.2l-2.1-.7a7 7 0 0 0-.6-1.5l1-2-1.6-1.6-2 1a7 7 0 0 0-1.5-.6L12.7 2h-2.2l-.7 2.1a7 7 0 0 0-1.5.6l-2-1-1.6 1.6 1 2a7 7 0 0 0-.6 1.5L3 10.9v2.2l2.1.7a7 7 0 0 0 .6 1.5l-1 2 1.6 1.6 2-1a7 7 0 0 0 1.5.6l.7 2.1h2.2l.7-2.1a7 7 0 0 0 1.5-.6l2 1 1.6-1.6-1-2a7 7 0 0 0 .6-1.5l2.1-.7Z" />
            </svg>
          </summary>
          <div class="settings-popover">
            <button id="restart" type="button">Restart battle</button>
          </div>
        </details>
        <span class="turn-pill" id="turn-pill" aria-live="polite">Player</span>
        <span class="turn-counter">Turn <strong id="turn-number">1</strong></span>
      </header>

      <section class="battlefield-frame">
        <div id="battlefield" class="battlefield" role="grid" aria-label="Tactical battlefield"></div>
        <div id="combat-forecast" class="combat-forecast" role="button" tabindex="-1" hidden>
          <strong>ATTACK</strong>
          <span id="forecast-matchup"></span>
          <b id="forecast-result"></b>
        </div>
        <div id="result-overlay" class="result-overlay" hidden>
          <p class="eyebrow" id="result-kicker">BATTLE COMPLETE</p>
          <h2 id="result-title">Victory</h2>
          <p id="result-copy">The pass is secure.</p>
          <button id="restart-overlay" class="primary-button" type="button">Play again</button>
        </div>
      </section>

      <section class="command-panel" aria-label="Unit commands">
        <div class="unit-summary">
          <div class="portrait" id="portrait" aria-hidden="true">A</div>
          <div>
            <span class="label" id="selected-team">Hero</span>
            <strong id="selected-name">Alden</strong>
            <span class="health-text" id="health-text">5 / 5 HP</span>
            <span class="unit-stats" id="unit-stats">ATK 2 · MOV 2</span>
          </div>
        </div>
        <div class="actions">
          <button id="end-turn" class="primary-button" type="button">End Turn</button>
        </div>
      </section>
      <p class="sr-only" id="instruction" aria-live="polite"></p>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
